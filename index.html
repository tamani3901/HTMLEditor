<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTMLブロックエディタ (iPad完全対応版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    /* iPadの画面高さ（100dvh）にぴったり合わせる */
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f2f5;
    }

    body {
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    /* 上部タブエリア */
    #tab-bar {
      display: flex;
      background: #333;
      overflow-x: auto;
      white-space: nowrap;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      height: 50px;
      align-items: center;
    }
    .tab-btn { background: #555; color: white; border: none; padding: 8px 16px; margin-right: 6px; border-radius: 6px; font-size: 14px; cursor: pointer; flex-shrink: 0; }
    .tab-btn.active { background: #007bff; font-weight: bold; }

    /* メインエリア */
    #main-container {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    /* ① 左：ブロックパレット */
    #palette { width: 220px; background: #fff; border-right: 2px solid #ccc; padding: 12px; overflow-y: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .palette-title { font-size: 13px; color: #666; margin-bottom: 10px; font-weight: bold; }

    /* ② 中央：編集キャンバス */
    #workspace { flex: 1; padding: 20px; overflow-y: auto; background: #e9ecef; border-right: 2px solid #ccc; position: relative; height: 100%; -webkit-overflow-scrolling: touch; }
    .workspace-hint { color: #888; border: 2px dashed #bbb; padding: 40px; text-align: center; border-radius: 8px; }

    /* ③ 右：サイドパネル */
    #right-panel { width: 340px; display: flex; flex-direction: column; background: #fff; padding: 12px; gap: 12px; flex-shrink: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* プレビュー */
    #preview-window { flex: 1; min-height: 220px; background: #fff; border: 2px solid #007bff; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .preview-header { background: #007bff; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .preview-controls { display: flex; gap: 4px; align-items: center; }
    .preview-tab-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .preview-tab-btn.active { background: white; color: #007bff; font-weight: bold; }

    .preview-container { flex: 1; display: flex; justify-content: center; background: #666; overflow: hidden; position: relative; }
    #preview-body { border: none; width: 100%; height: 100%; background: #fff; transition: width 0.3s; }
    #preview-body.mobile-mode { width: 375px; height: 100%; border-left: 1px solid #ccc; border-right: 1px solid #ccc; }
    #preview-code { flex: 1; width: 100%; height: 100%; padding: 8px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; display: none; background: #282c34; color: #abb2bf; }

    /* 操作ボタン */
    #action-buttons { display: flex; flex-direction: column; gap: 6px; }
    .btn-row { display: flex; gap: 6px; align-items: center; }
    .action-btn { flex: 1; background: #28a745; color: white; border: none; padding: 10px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; text-align: center; }
    .action-btn.danger { background: #dc3545; }
    .action-btn.secondary { background: #6c757d; }
    .slot-select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 12px; }

    /* ブロックデザイン */
    .block { background: #4a90e2; color: white; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); touch-action: none; position: relative; flex-wrap: wrap; }
    .block input, .block select { border-radius: 4px; border: none; padding: 4px 6px; font-size: 12px; user-select: text; -webkit-user-select: text; max-width: 120px; }
    
    .block-tools { margin-left: auto; display: flex; gap: 4px; }
    .tool-btn { background: rgba(0,0,0,0.2); color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer; }
    .tool-btn:hover { background: rgba(0,0,0,0.4); }
    .delete-btn { background: #ff4d4d; }

    .block.container-block { background: #ff9800; flex-direction: column; align-items: flex-start; }
    .container-slot { width: 100%; min-height: 45px; background: rgba(255,255,255,0.3); border: 2px dashed rgba(255,255,255,0.8); margin-top: 8px; border-radius: 6px; padding: 8px; box-sizing: border-box; }

    .css-slot { background: rgba(0,0,0,0.25); border: 1px dashed #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; min-width: 45px; min-height: 24px; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .var-slot { background: rgba(233, 30, 99, 0.35); border: 1px dashed #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; min-width: 45px; min-height: 24px; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .event-slot { background: rgba(76, 175, 80, 0.4); border: 1px dashed #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; min-width: 45px; min-height: 24px; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }

    .block.css-block { background: #9c27b0; margin-bottom: 0; }
    .block.var-block { background: #e91e63; margin-bottom: 0; }
    .block.event-block { background: #2e7d32; margin-bottom: 0; }

    .drag-clone { position: fixed; pointer-events: none; opacity: 0.85; z-index: 1000; transform: translate(-50%, -50%); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .drag-over { border-color: #00ffcc !important; background: rgba(0, 255, 204, 0.3) !important; }
    
    #drop-indicator { height: 4px; background: #00ffcc; border-radius: 2px; margin: 4px 0; display: none; pointer-events: none; width: 100%; }

    #file-input-asset, #file-input-json { display: none; }
  </style>
</head>
<body>

  <!-- iPadで全てのファイルを選択できるように accept="*/*" に指定 -->
  <input type="file" id="file-input-asset" accept="*/*">
  <input type="file" id="file-input-json" accept=".json">

  <!-- ① 上部タブ -->
  <div id="tab-bar">
    <button class="tab-btn active" onclick="switchTab(event, 'media')">🖼 メディア</button>
    <button class="tab-btn" onclick="switchTab(event, 'text')">📝 テキスト</button>
    <button class="tab-btn" onclick="switchTab(event, 'interactive')">🔗 リンク・ボタン</button>
    <button class="tab-btn" onclick="switchTab(event, 'containers')">📦 枠・レイアウト</button>
    <button class="tab-btn" onclick="switchTab(event, 'lists')">📋 リスト</button>
    <button class="tab-btn" onclick="switchTab(event, 'forms')">📝 フォーム</button>
    <button class="tab-btn" onclick="switchTab(event, 'css')">🎨 CSS・サイズ</button>
    <button class="tab-btn" onclick="switchTab(event, 'variables')">🔤 変数・イベント</button>
    <button class="tab-btn" onclick="switchTab(event, 'data')">📁 データ</button>
  </div>

  <div id="main-container">
    <!-- ② 左：パレット -->
    <div id="palette">
      <div class="palette-title">ドラッグして配置</div>
      <div id="palette-blocks"></div>
    </div>

    <!-- ③ 中央：編集エリア -->
    <div id="workspace">
      <div class="workspace-hint">ここにブロックをドラッグ＆ドロップしてください</div>
    </div>

    <!-- ④ 右：プレビュー ＋ 操作ボタン -->
    <div id="right-panel">
      <div id="preview-window">
        <div class="preview-header">
          <span>プレビュー</span>
          <div class="preview-controls">
            <button class="preview-tab-btn" onclick="toggleViewport('desktop')">💻</button>
            <button class="preview-tab-btn" onclick="toggleViewport('mobile')">📱</button>
            <span>|</span>
            <button class="preview-tab-btn active" onclick="togglePreviewTab('render')">画面</button>
            <button class="preview-tab-btn" onclick="togglePreviewTab('code')">HTML</button>
          </div>
        </div>
        <div class="preview-container">
          <iframe id="preview-body"></iframe>
          <pre id="preview-code"></pre>
        </div>
      </div>

      <div id="action-buttons">
        <div class="btn-row">
          <button class="action-btn" onclick="exportHTML()">HTMLエクスポート</button>
          <button class="action-btn secondary" onclick="document.getElementById('file-input-asset').click()">ファイルインポート</button>
        </div>
        <div class="btn-row">
          <select id="save-slot-select" class="slot-select">
            <option value="1">セーブ 1</option>
            <option value="2">セーブ 2</option>
            <option value="3">セーブ 3</option>
            <option value="4">セーブ 4</option>
            <option value="5">セーブ 5</option>
          </select>
          <button class="action-btn secondary" onclick="saveToLocalStorage()">セーブ</button>
          <button class="action-btn secondary" onclick="loadFromLocalStorage()">読み込み</button>
        </div>
        <div class="btn-row">
          <button class="action-btn secondary" onclick="exportJSON()">JSON書き出し</button>
          <button class="action-btn secondary" onclick="document.getElementById('file-input-json').click()">JSON読み込み</button>
        </div>
        <div class="btn-row">
          <button class="action-btn danger" onclick="clearLocalStorage()">選択スロットを削除</button>
          <button class="action-btn danger" onclick="resetWorkspace()">リセット</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const customAssets = [];

    const blockDefinitions = {
      media: [
        { type: 'img', label: '画像', html: '画像 [URL: <input type="text" class="val-src" value="https://via.placeholder.com/150" oninput="updatePreview()">]', isContainer: false },
        { type: 'video', label: '動画', html: '動画 [URL: <input type="text" class="val-src" value="" oninput="updatePreview()">]', isContainer: false },
        { type: 'audio', label: '音声', html: '音声 [URL: <input type="text" class="val-src" value="" oninput="updatePreview()">]', isContainer: false }
      ],
      text: [
        { type: 'heading', label: '見出し', html: '見出し [<select class="val-tag" onchange="updatePreview()"><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option></select>] [ID: <input type="text" class="val-id" value="" oninput="updatePreview()">] <input type="text" class="val-text" value="見出し" oninput="updatePreview()">', isContainer: false, hasVarSlot: true },
        { type: 'p', label: '段落', html: '段落 [ID: <input type="text" class="val-id" value="" oninput="updatePreview()">] <input type="text" class="val-text" value="ここに文章が入ります" oninput="updatePreview()">', isContainer: false, hasVarSlot: true },
        { type: 'br', label: '改行', html: '改行 (<br>)', isContainer: false }
      ],
      interactive: [
        { type: 'a', label: 'リンク', html: 'リンク [URL: <input type="text" class="val-href" value="https://example.com" oninput="updatePreview()">] 表示: <input type="text" class="val-text" value="リンクテキスト" oninput="updatePreview()">', isContainer: false, hasVarSlot: true },
        { type: 'button', label: 'ボタン', html: 'ボタン [ID: <input type="text" class="val-id" value="btn1" oninput="updatePreview()">] [ラベル: <input type="text" class="val-text" value="ボタン" oninput="updatePreview()">]', isContainer: false, hasVarSlot: true, hasEventSlot: true }
      ],
      containers: [
        { type: 'div', label: 'グループ (div)', html: 'グループ (div) [ID: <input type="text" class="val-id" value="" oninput="updatePreview()">]', isContainer: true, tag: 'div' },
        { type: 'main', label: 'メインエリア', html: 'メインエリア (main)', isContainer: true, tag: 'main' },
        { type: 'header', label: 'ヘッダー', html: 'ヘッダー (header)', isContainer: true, tag: 'header' },
        { type: 'footer', label: 'フッター', html: 'フッター (footer)', isContainer: true, tag: 'footer' }
      ],
      lists: [
        { type: 'ul', label: '箇条書きリスト (ul)', html: '箇条書きリスト (ul)', isContainer: true, tag: 'ul' },
        { type: 'ol', label: '番号順リスト (ol)', html: '番号順リスト (ol)', isContainer: true, tag: 'ol' },
        { type: 'li', label: 'リスト項目 (li)', html: '項目 <input type="text" class="val-text" value="項目テキスト" oninput="updatePreview()">', isContainer: false, hasVarSlot: true }
      ],
      forms: [
        { type: 'form', label: 'フォーム (form)', html: 'フォーム (form)', isContainer: true, tag: 'form' },
        { type: 'input-text', label: '1行入力欄', html: '入力枠 [ID: <input type="text" class="val-id" value="input1" oninput="updatePreview()"> ヒント: <input type="text" class="val-ph" value="入力してください" oninput="updatePreview()">]', isContainer: false },
        { type: 'submit', label: '送信ボタン', html: '送信ボタン [ID: <input type="text" class="val-id" value="sub1" oninput="updatePreview()">] [文字: <input type="text" class="val-text" value="送信" oninput="updatePreview()">]', isContainer: false, hasVarSlot: true, hasEventSlot: true }
      ],
      css: [
        { type: 'css-width', label: '幅 (width)', html: '幅: <input type="text" class="val-text" value="200px" oninput="updatePreview()">', isCss: true, cssProp: 'width' },
        { type: 'css-height', label: '高さ (height)', html: '高さ: <input type="text" class="val-text" value="auto" oninput="updatePreview()">', isCss: true, cssProp: 'height' },
        { type: 'css-color', label: '文字色', html: '文字色: <input type="color" class="val-css-color" value="#ff0000" onchange="updatePreview()">', isCss: true, cssProp: 'color' },
        { type: 'css-bg', label: '背景色', html: '背景色: <input type="color" class="val-css-bg" value="#e0f7fa" onchange="updatePreview()">', isCss: true, cssProp: 'background-color' },
        { type: 'css-fontsize', label: '文字サイズ', html: 'サイズ: <input type="text" class="val-text" value="16px" oninput="updatePreview()">', isCss: true, cssProp: 'font-size' },
        { type: 'css-margin', label: '外側余白 (margin)', html: '余白: <input type="text" class="val-text" value="10px" oninput="updatePreview()">', isCss: true, cssProp: 'margin' },
        { type: 'css-padding', label: '内側余白 (padding)', html: '内余白: <input type="text" class="val-text" value="10px" oninput="updatePreview()">', isCss: true, cssProp: 'padding' },
        { type: 'css-radius', label: '角丸 (radius)', html: '角丸: <input type="text" class="val-text" value="8px" oninput="updatePreview()">', isCss: true, cssProp: 'border-radius' }
      ],
      variables: [
        { type: 'var-static', label: '📌 静的変数 (固定値)', html: '変数名: <input type="text" class="val-var-name" value="user" oninput="updatePreview()"> = 値: <input type="text" class="val-var-val" value="ゲスト" oninput="updatePreview()">', isVar: true },
        { type: 'var-input', label: '⌨️ 入力欄参照変数', html: '参照先入力ID: <input type="text" class="val-target-id" value="input1" oninput="updatePreview()">', isVar: true },
        { type: 'evt-show-input', label: '⚡ タップ時: 入力値を表示', html: '入力ID: <input type="text" class="val-from-id" value="input1" oninput="updatePreview()"> の値を ID: <input type="text" class="val-to-id" value="target1" oninput="updatePreview()"> に表示', isEvent: true },
        { type: 'evt-show-text', label: '⚡ タップ時: テキスト表示', html: '文字: <input type="text" class="val-text" value="送信しました！" oninput="updatePreview()"> を ID: <input type="text" class="val-to-id" value="target1" oninput="updatePreview()"> に表示', isEvent: true }
      ],
      data: []
    };

    let activeTabKey = 'media';
    let activeDragData = null;
    let dragCloneEl = null;

    function getDropIndicator() {
      let indicator = document.getElementById('drop-indicator');
      if (!indicator) {
        indicator = document.createElement('div');
        indicator.id = 'drop-indicator';
        document.body.appendChild(indicator);
      }
      return indicator;
    }

    function switchTab(evt, tabKey) {
      activeTabKey = tabKey;
      document.querySelectorAll('#tab-bar .tab-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.target) {
        evt.target.classList.add('active');
      } else {
        const btns = document.querySelectorAll('#tab-bar .tab-btn');
        const targetBtn = Array.from(btns).find(b => b.getAttribute('onclick').includes(`'${tabKey}'`));
        if (targetBtn) targetBtn.classList.add('active');
      }

      const palette = document.getElementById('palette-blocks');
      palette.innerHTML = '';

      let blocks = blockDefinitions[tabKey] || [];
      if (tabKey === 'data') blocks = customAssets;

      if (blocks.length === 0 && tabKey === 'data') {
        palette.innerHTML = '<div style="color:#888; font-size:12px; padding:10px;">インポートしたファイルがここに表示されます</div>';
        return;
      }

      blocks.forEach(data => {
        const el = document.createElement('div');
        el.className = `block ${data.isContainer ? 'container-block' : ''} ${data.isCss ? 'css-block' : ''} ${data.isVar ? 'var-block' : ''} ${data.isEvent ? 'event-block' : ''}`;
        el.innerHTML = data.label;
        
        const startDrag = (clientX, clientY) => {
          activeDragData = data;
          dragCloneEl = el.cloneNode(true);
          dragCloneEl.classList.add('drag-clone');
          dragCloneEl.style.left = `${clientX}px`;
          dragCloneEl.style.top = `${clientY}px`;
          document.body.appendChild(dragCloneEl);
        };

        el.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        el.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));

        palette.appendChild(el);
      });
    }

    const moveDrag = (clientX, clientY) => {
      if (!dragCloneEl) return;
      dragCloneEl.style.left = `${clientX}px`;
      dragCloneEl.style.top = `${clientY}px`;

      const targetEl = document.elementFromPoint(clientX, clientY);
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      
      const indicator = getDropIndicator();
      indicator.style.display = 'none';

      if (targetEl) {
        const dropZone = targetEl.closest('.container-slot, .css-slot, .var-slot, .event-slot, #workspace');
        if (dropZone) {
          if (dropZone.classList.contains('container-slot') || dropZone.classList.contains('css-slot') || dropZone.classList.contains('var-slot') || dropZone.classList.contains('event-slot')) {
            dropZone.classList.add('drag-over');
          }

          const siblingBlocks = Array.from(dropZone.children).filter(child => child.classList.contains('block'));
          let afterElement = null;
          for (const child of siblingBlocks) {
            const box = child.getBoundingClientRect();
            if (clientY > box.top + box.height / 2) {
              afterElement = child;
            }
          }

          if (afterElement) {
            afterElement.after(indicator);
          } else {
            dropZone.prepend(indicator);
          }
          indicator.style.display = 'block';
        }
      }
    };

    const endDrag = (clientX, clientY) => {
      if (!activeDragData || !dragCloneEl) return;

      const indicator = getDropIndicator();
      const targetEl = document.elementFromPoint(clientX, clientY);
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

      if (targetEl) {
        const dropZone = targetEl.closest('.container-slot, .css-slot, .var-slot, .event-slot, #workspace');
        if (dropZone) {
          const hint = document.querySelector('.workspace-hint');
          if (hint) hint.remove();

          const newBlock = createWorkspaceBlock(activeDragData, dropZone);
          
          if (indicator.parentNode === dropZone) {
            indicator.after(newBlock);
          }

          updatePreview();
        }
      }

      indicator.style.display = 'none';
      dragCloneEl.remove();
      dragCloneEl = null;
      activeDragData = null;
    };

    window.addEventListener('touchmove', (e) => dragCloneEl && moveDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    window.addEventListener('touchend', (e) => dragCloneEl && endDrag(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', (e) => endDrag(e.clientX, e.clientY));

    function createWorkspaceBlock(data, targetZone, savedValues = null) {
      const newBlock = document.createElement('div');
      newBlock.className = `block ${data.isContainer ? 'container-block' : ''} ${data.isCss ? 'css-block' : ''} ${data.isVar ? 'var-block' : ''} ${data.isEvent ? 'event-block' : ''}`;
      newBlock.dataset.type = data.type;
      if (data.tag) newBlock.dataset.tag = data.tag;
      if (data.cssProp) newBlock.dataset.cssProp = data.cssProp;
      
      let innerHTML = `<span>${data.html}</span>`;
      
      if (!data.isCss && !data.isVar && !data.isEvent) {
        innerHTML += ` <span class="css-slot">CSS</span>`;
        if (data.hasVarSlot) innerHTML += ` <span class="var-slot">VAR</span>`;
        if (data.hasEventSlot) innerHTML += ` <span class="event-slot">EVENT</span>`;
      }

      if (data.isContainer) innerHTML += `<div class="container-slot"></div>`;

      innerHTML += `
        <div class="block-tools">
          <button class="tool-btn" onclick="duplicateBlock(this)">📋</button>
          <button class="tool-btn delete-btn" onclick="this.closest('.block').remove(); updatePreview();">✕</button>
        </div>
      `;

      newBlock.innerHTML = innerHTML;
      targetZone.appendChild(newBlock);

      if (savedValues) {
        if (savedValues.tag && newBlock.querySelector('.val-tag')) newBlock.querySelector('.val-tag').value = savedValues.tag;
        if (savedValues.text && newBlock.querySelector('.val-text')) newBlock.querySelector('.val-text').value = savedValues.text;
        if (savedValues.src && newBlock.querySelector('.val-src')) newBlock.querySelector('.val-src').value = savedValues.src;
        if (savedValues.href && newBlock.querySelector('.val-href')) newBlock.querySelector('.val-href').value = savedValues.href;
        if (savedValues.ph && newBlock.querySelector('.val-ph')) newBlock.querySelector('.val-ph').value = savedValues.ph;
        if (savedValues.id && newBlock.querySelector('.val-id')) newBlock.querySelector('.val-id').value = savedValues.id;
        if (savedValues.cssColor && newBlock.querySelector('.val-css-color')) newBlock.querySelector('.val-css-color').value = savedValues.cssColor;
        if (savedValues.cssBg && newBlock.querySelector('.val-css-bg')) newBlock.querySelector('.val-css-bg').value = savedValues.cssBg;
        if (savedValues.varName && newBlock.querySelector('.val-var-name')) newBlock.querySelector('.val-var-name').value = savedValues.varName;
        if (savedValues.varVal && newBlock.querySelector('.val-var-val')) newBlock.querySelector('.val-var-val').value = savedValues.varVal;
        if (savedValues.targetId && newBlock.querySelector('.val-target-id')) newBlock.querySelector('.val-target-id').value = savedValues.targetId;
        if (savedValues.fromId && newBlock.querySelector('.val-from-id')) newBlock.querySelector('.val-from-id').value = savedValues.fromId;
        if (savedValues.toId && newBlock.querySelector('.val-to-id')) newBlock.querySelector('.val-to-id').value = savedValues.toId;
      }

      return newBlock;
    }

    function duplicateBlock(btn) {
      const targetBlock = btn.closest('.block');
      const serialized = serializeNode(targetBlock.parentElement);
      const blockIndex = Array.from(targetBlock.parentElement.children).filter(c => c.classList.contains('block')).indexOf(targetBlock);
      
      if (blockIndex !== -1 && serialized[blockIndex]) {
        deserializeNode([serialized[blockIndex]], targetBlock.parentElement);
        updatePreview();
      }
    }

    function getInnerTextOrVar(child) {
      const varSlot = child.querySelector(':scope > .var-slot');
      if (varSlot) {
        const varBlock = varSlot.querySelector(':scope > .block.var-block');
        if (varBlock) {
          const vType = varBlock.dataset.type;
          if (vType === 'var-static') {
            return varBlock.querySelector('.val-var-val')?.value || '';
          } else if (vType === 'var-input') {
            const targetId = varBlock.querySelector('.val-target-id')?.value || '';
            return `<span data-bind-input="${targetId}"></span>`;
          }
        }
      }
      return child.querySelector('.val-text')?.value || '';
    }

    let generatedEventScripts = [];

    function generateHTML(node) {
      let html = '';
      const children = node.children;

      for (let child of children) {
        if (!child.classList.contains('block') || child.classList.contains('css-block') || child.classList.contains('var-block') || child.classList.contains('event-block')) continue;

        const type = child.dataset.type;
        const tag = child.dataset.tag;
        const elemId = child.querySelector('.val-id')?.value || '';
        const idAttr = elemId ? ` id="${elemId}"` : '';

        let inlineStyle = '';
        const cssSlot = child.querySelector(':scope > .css-slot');
        if (cssSlot) {
          const cssBlocks = cssSlot.querySelectorAll(':scope > .block.css-block');
          cssBlocks.forEach(cssBlock => {
            const prop = cssBlock.dataset.cssProp;
            const input = cssBlock.querySelector('input');
            if (prop && input) {
              inlineStyle += `${prop}:${input.value}; `;
            }
          });
        }
        const styleAttr = inlineStyle ? ` style="${inlineStyle.trim()}"` : '';

        const eventSlot = child.querySelector(':scope > .event-slot');
        if (eventSlot && elemId) {
          const evtBlock = eventSlot.querySelector(':scope > .event-block');
          if (evtBlock) {
            const evtType = evtBlock.dataset.type;
            if (evtType === 'evt-show-input') {
              const fromId = evtBlock.querySelector('.val-from-id')?.value || '';
              const toId = evtBlock.querySelector('.val-to-id')?.value || '';
              generatedEventScripts.push(`
                document.getElementById('${elemId}')?.addEventListener('click', (e) => {
                  e.preventDefault();
                  const val = document.getElementById('${fromId}')?.value || '';
                  const target = document.getElementById('${toId}');
                  if (target) target.textContent = val;
                });
              `);
            } else if (evtType === 'evt-show-text') {
              const textVal = evtBlock.querySelector('.val-text')?.value || '';
              const toId = evtBlock.querySelector('.val-to-id')?.value || '';
              generatedEventScripts.push(`
                document.getElementById('${elemId}')?.addEventListener('click', (e) => {
                  e.preventDefault();
                  const target = document.getElementById('${toId}');
                  if (target) target.textContent = '${textVal}';
                });
              `);
            }
          }
        }

        if (type === 'heading') {
          const level = child.querySelector('.val-tag').value;
          const text = getInnerTextOrVar(child);
          html += `<${level}${idAttr}${styleAttr}>${text}</${level}>\n`;
        } else if (type === 'p') {
          const text = getInnerTextOrVar(child);
          html += `<p${idAttr}${styleAttr}>${text}</p>\n`;
        } else if (type === 'br') {
          html += `<br>\n`;
        } else if (type === 'img') {
          const src = child.querySelector('.val-src').value;
          html += `<img src="${src}"${idAttr}${styleAttr}>\n`;
        } else if (type === 'video') {
          const src = child.querySelector('.val-src').value;
          /* iPad Safariの自動再生制限や表示崩れを防ぐため playsinline コントロールを追加 */
          html += `<video src="${src}" controls playsinline${idAttr}${styleAttr}></video>\n`;
        } else if (type === 'audio') {
          const src = child.querySelector('.val-src').value;
          html += `<audio src="${src}" controls${idAttr}${styleAttr}></audio>\n`;
        } else if (type === 'a') {
          const href = child.querySelector('.val-href').value;
          const text = getInnerTextOrVar(child);
          html += `<a href="${href}" target="_blank" rel="noopener noreferrer"${idAttr}${styleAttr}>${text}</a>\n`;
        } else if (type === 'button') {
          const text = getInnerTextOrVar(child);
          html += `<button${idAttr}${styleAttr}>${text}</button>\n`;
        } else if (type === 'li') {
          const text = getInnerTextOrVar(child);
          html += `<li${idAttr}${styleAttr}>${text}</li>\n`;
        } else if (type === 'input-text') {
          const ph = child.querySelector('.val-ph').value;
          html += `<input type="text"${idAttr} placeholder="${ph}"${styleAttr}>\n`;
        } else if (type === 'submit') {
          const text = getInnerTextOrVar(child);
          html += `<input type="submit"${idAttr} value="${text}"${styleAttr}>\n`;
        } else if (child.classList.contains('container-block')) {
          const containerSlot = child.querySelector(':scope > .container-slot');
          const innerHTML = containerSlot ? generateHTML(containerSlot) : '';
          const indentedInner = innerHTML ? '\n' + innerHTML.split('\n').map(line => line ? '  ' + line : '').join('\n') + '\n' : '';
          html += `<${tag}${idAttr}${styleAttr}>${indentedInner}</${tag}>\n`;
        }
      }
      return html;
    }

    function updatePreview() {
      generatedEventScripts = [];
      const workspace = document.getElementById('workspace');
      const bodyHTML = generateHTML(workspace);
      const iframe = document.getElementById('preview-body');

      const runtimeScript = `
  <script>
    document.addEventListener('input', (e) => {
      if (e.target.id) {
        const binds = document.querySelectorAll('[data-bind-input="' + e.target.id + '"]');
        binds.forEach(el => el.textContent = e.target.value);
      }
    });
    document.addEventListener('DOMContentLoaded', () => {
      ${generatedEventScripts.join('\n')}
    });
  <\/script>
`;
      
      const previewDocumentContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_blank">
  <style>
    body { font-family: sans-serif; padding: 10px; }
    input, textarea { font-size: 14px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    video, img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
${bodyHTML}
${runtimeScript}
</body>
</html>`;

      iframe.srcdoc = previewDocumentContent;
      document.getElementById('preview-code').textContent = bodyHTML || '<!-- ブロックを配置するとここにHTMLが出力されます -->';

      const data = serializeNode(workspace);
      localStorage.setItem('html_block_editor_autosave', JSON.stringify(data));
    }

    function togglePreviewTab(mode) {
      const btns = document.querySelectorAll('.preview-tab-btn');
      const iframe = document.getElementById('preview-body');
      const code = document.getElementById('preview-code');

      if (mode === 'render') {
        btns[2].classList.add('active');
        btns[3].classList.remove('active');
        iframe.style.display = 'block';
        code.style.display = 'none';
      } else {
        btns[3].classList.add('active');
        btns[2].classList.remove('active');
        iframe.style.display = 'none';
        code.style.display = 'block';
      }
    }

    function toggleViewport(device) {
      const iframe = document.getElementById('preview-body');
      if (device === 'mobile') {
        iframe.classList.add('mobile-mode');
      } else {
        iframe.classList.remove('mobile-mode');
      }
    }

    function resetWorkspace() {
      if (confirm('作成中の配置をすべてクリアしますか？')) {
        document.getElementById('workspace').innerHTML = '<div class="workspace-hint">ここにブロックをドラッグ＆ドロップしてください</div>';
        updatePreview();
      }
    }

    function exportHTML() {
      generatedEventScripts = [];
      const workspace = document.getElementById('workspace');
      const bodyHTML = generateHTML(workspace);

      const runtimeScript = `
  <script>
    document.addEventListener('input', (e) => {
      if (e.target.id) {
        const binds = document.querySelectorAll('[data-bind-input="' + e.target.id + '"]');
        binds.forEach(el => el.textContent = e.target.value);
      }
    });
    document.addEventListener('DOMContentLoaded', () => {
      ${generatedEventScripts.join('\n')}
    });
  <\/script>
`;

      const fullHTML = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exported Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    input, textarea { font-size: 14px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    video, img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
${bodyHTML}
${runtimeScript}
</body>
</html>`;

      downloadFile('index.html', fullHTML, 'text/html');
    }

    /* iPadの再生制限を回避するため createObjectURL を使用 */
    document.getElementById('file-input-asset').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const mediaUrl = URL.createObjectURL(file);
      let fileType = 'img';
      let label = `画像 (${file.name})`;

      if (file.type.startsWith('video/')) {
        fileType = 'video';
        label = `動画 (${file.name})`;
      } else if (file.type.startsWith('audio/')) {
        fileType = 'audio';
        label = `音声 (${file.name})`;
      } else {
        // 未知の拡張子でも拡張子やファイル名で判定を試みる
        const nameLower = file.name.toLowerCase();
        if (nameLower.endsWith('.mp3') || nameLower.endsWith('.m4a') || nameLower.endsWith('.wav') || nameLower.endsWith('.aac')) {
          fileType = 'audio';
          label = `音声 (${file.name})`;
        } else if (nameLower.endsWith('.mp4') || nameLower.endsWith('.mov') || nameLower.endsWith('.webm')) {
          fileType = 'video';
          label = `動画 (${file.name})`;
        }
      }

      const assetBlock = {
        type: fileType,
        label: label,
        html: `${label.split(' ')[0]} [URL: <input type="text" class="val-src" value="${mediaUrl}" oninput="updatePreview()">]`,
        isContainer: false
      };

      customAssets.push(assetBlock);
      switchTab(null, 'data');
      alert(`ファイル "${file.name}" を読み込みました！データタブから配置できます。`);
      this.value = '';
    });

    function serializeNode(node) {
      const result = [];
      const children = node.children;
      for (let child of children) {
        if (!child.classList.contains('block')) continue;

        const blockData = {
          type: child.dataset.type,
          tag: child.dataset.tag || null,
          cssProp: child.dataset.cssProp || null,
          isContainer: child.classList.contains('container-block'),
          isCss: child.classList.contains('css-block'),
          isVar: child.classList.contains('var-block'),
          isEvent: child.classList.contains('event-block'),
          values: {
            tag: child.querySelector('.val-tag')?.value || null,
            text: child.querySelector('.val-text')?.value || null,
            src: child.querySelector('.val-src')?.value || null,
            href: child.querySelector('.val-href')?.value || null,
            ph: child.querySelector('.val-ph')?.value || null,
            id: child.querySelector('.val-id')?.value || null,
            cssColor: child.querySelector('.val-css-color')?.value || null,
            cssBg: child.querySelector('.val-css-bg')?.value || null,
            varName: child.querySelector('.val-var-name')?.value || null,
            varVal: child.querySelector('.val-var-val')?.value || null,
            targetId: child.querySelector('.val-target-id')?.value || null,
            fromId: child.querySelector('.val-from-id')?.value || null,
            toId: child.querySelector('.val-to-id')?.value || null
          },
          cssChildren: [],
          varChildren: [],
          eventChildren: [],
          containerChildren: []
        };

        const cssSlot = child.querySelector(':scope > .css-slot');
        if (cssSlot) blockData.cssChildren = serializeNode(cssSlot);

        const varSlot = child.querySelector(':scope > .var-slot');
        if (varSlot) blockData.varChildren = serializeNode(varSlot);

        const eventSlot = child.querySelector(':scope > .event-slot');
        if (eventSlot) blockData.eventChildren = serializeNode(eventSlot);

        const containerSlot = child.querySelector(':scope > .container-slot');
        if (containerSlot) blockData.containerChildren = serializeNode(containerSlot);

        result.push(blockData);
      }
      return result;
    }

    function deserializeNode(dataList, targetZone) {
      dataList.forEach(item => {
        let definition = null;
        for (let cat in blockDefinitions) {
          const found = blockDefinitions[cat].find(b => b.type === item.type);
          if (found) { definition = found; break; }
        }
        if (!definition) {
          definition = customAssets.find(b => b.type === item.type) || {
            type: item.type,
            label: item.type,
            html: `要素 [URL: <input type="text" class="val-src" value="" oninput="updatePreview()">]`,
            isContainer: item.isContainer,
            isCss: item.isCss,
            isVar: item.isVar,
            isEvent: item.isEvent
          };
        }

        const newBlock = createWorkspaceBlock(definition, targetZone, item.values);

        if (item.cssChildren && item.cssChildren.length > 0) {
          const cssSlot = newBlock.querySelector(':scope > .css-slot');
          if (cssSlot) deserializeNode(item.cssChildren, cssSlot);
        }

        if (item.varChildren && item.varChildren.length > 0) {
          const varSlot = newBlock.querySelector(':scope > .var-slot');
          if (varSlot) deserializeNode(item.varChildren, varSlot);
        }

        if (item.eventChildren && item.eventChildren.length > 0) {
          const eventSlot = newBlock.querySelector(':scope > .event-slot');
          if (eventSlot) deserializeNode(item.eventChildren, eventSlot);
        }

        if (item.containerChildren && item.containerChildren.length > 0) {
          const containerSlot = newBlock.querySelector(':scope > .container-slot');
          if (containerSlot) deserializeNode(item.containerChildren, containerSlot);
        }
      });
    }

    function saveToLocalStorage() {
      const slot = document.getElementById('save-slot-select').value;
      const workspace = document.getElementById('workspace');
      const data = serializeNode(workspace);
      localStorage.setItem('html_block_editor_slot_' + slot, JSON.stringify(data));
      alert(`スロット ${slot} に保存しました。`);
      updatePreview();
    }

    function loadFromLocalStorage() {
      const slot = document.getElementById('save-slot-select').value;
      const json = localStorage.getItem('html_block_editor_slot_' + slot);
      if (!json) {
        alert(`スロット ${slot} には保存データがありません。`);
        return;
      }
      const data = JSON.parse(json);
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = '';
      deserializeNode(data, workspace);
      updatePreview();
      alert(`スロット ${slot} を読み込みました。`);
    }

    function clearLocalStorage() {
      const slot = document.getElementById('save-slot-select').value;
      if (confirm(`スロット ${slot} の保存データを削除しますか？`)) {
        localStorage.removeItem('html_block_editor_slot_' + slot);
        alert(`スロット ${slot} を削除しました。`);
        updatePreview();
      }
    }

    function exportJSON() {
      const workspace = document.getElementById('workspace');
      const data = serializeNode(workspace);
      downloadFile('workspace.json', JSON.stringify(data, null, 2), 'application/json');
    }

    document.getElementById('file-input-json').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          const workspace = document.getElementById('workspace');
          workspace.innerHTML = '';
          deserializeNode(data, workspace);
          updatePreview();
          alert('JSONファイルから読み込みました。');
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    function downloadFile(filename, content, contentType) {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    switchTab(null, 'media');
    if (localStorage.getItem('html_block_editor_autosave')) {
      const data = JSON.parse(localStorage.getItem('html_block_editor_autosave'));
      const workspace = document.getElementById('workspace');
      if (data && data.length > 0) {
        workspace.innerHTML = '';
        deserializeNode(data, workspace);
      }
    }
    updatePreview();
  </script>
</body>
</html>
