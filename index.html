<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブロック de HTML エディタ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:#eef1f5;color:#232a31;font-size:14px;user-select:none;-webkit-user-select:none;overflow:hidden;}
  input,select,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;}
  #app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  #topbar{flex:0 0 auto;display:flex;gap:8px;padding:6px 10px;background:#f4f6f9;border-bottom:1px solid #dfe4ea;align-items:center;}
  .hist-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid #dfe4ea;background:#fff;border-radius:8px;font-size:12.5px;color:#3b4652;cursor:pointer;transition:.12s;font-family:inherit;}
  .hist-btn:hover:not(:disabled){background:#eef7f5;border-color:#8fd8c8;color:#1d9e83;}
  .hist-btn:disabled{opacity:.4;cursor:not-allowed;}
  .hist-btn .hi{font-size:15px;line-height:1;font-weight:700;}
  .hist-info{margin-left:auto;font-size:11px;color:#8b97a3;}
  #tabbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;background:#fff;border-bottom:1px solid #dfe4ea;align-items:flex-start;align-content:flex-start;}
  .tab{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid #dfe4ea;background:#f8fafc;font-size:11.5px;color:#3b4652;cursor:pointer;white-space:nowrap;transition:.15s;line-height:1.3;}
  .tab:hover{background:#eef7f5;border-color:#8fd8c8;}
  .tab.active{background:#2ec4a6;border-color:#2ec4a6;color:#fff;font-weight:700;}
  .tab.preset-tab.active{background:#ff9800;border-color:#ff9800;}
  .tab.design-tab.active{background:#7e57c2;border-color:#7e57c2;}
  .tab.api-tab.active{background:#e91e63;border-color:#e91e63;}
  #main{flex:1 1 auto;display:grid;grid-template-columns:240px minmax(0,1fr) 340px;min-height:0;overflow:hidden;}
  #palette{background:#fff;border-right:1px solid #dfe4ea;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  #palette-head{flex:0 0 auto;padding:10px 12px;font-size:11.5px;font-weight:700;color:#5b6875;letter-spacing:.04em;border-bottom:1px solid #eef1f5;background:#fbfcfe;}
  #palette-list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;}
  #palette-list::-webkit-scrollbar{width:6px;}
  #palette-list::-webkit-scrollbar-thumb{background:#cfd8e0;border-radius:3px;}
  .pal-item{display:flex;align-items:stretch;gap:6px;padding:0;border:1px solid #dfe4ea;border-radius:10px;background:#fbfdff;font-size:12.5px;transition:.12s;flex:0 0 auto;touch-action:pan-y;overflow:hidden;min-height:42px;}
  .pal-item:hover{border-color:#8fd8c8;background:#f2fbf9;}
  .pal-item.preset-item{background:#fffbf2;border-color:#ffe0b2;}
  .pal-item.preset-item:hover{background:#fff5e0;border-color:#ffb74d;}
  .pal-item.design-item{background:#f8f5ff;border-color:#e1d5f7;}
  .pal-item.design-item:hover{background:#f0e9ff;border-color:#b39ddb;}
  .pal-item.api-item{background:#fff0f5;border-color:#f8bbd0;}
  .pal-item.api-item:hover{background:#ffe0ec;border-color:#f06292;}
  .drag-handle{flex:0 0 auto;width:38px;display:flex;align-items:center;justify-content:center;background:#f1f5f8;color:#96a3b0;font-size:18px;cursor:grab;touch-action:none;user-select:none;line-height:1;font-weight:700;letter-spacing:-2px;padding-left:6px;transition:.12s;}
  .drag-handle:hover{background:#e0f0eb;color:#1d9e83;}
  .drag-handle:active{cursor:grabbing;background:#c8e8e0;color:#0d8c72;}
  .pal-item.preset-item .drag-handle{background:#fff3e0;color:#c58a3b;}
  .pal-item.design-item .drag-handle{background:#f0e9ff;color:#9d7ec5;}
  .pal-item.api-item .drag-handle{background:#ffe0ec;color:#c9527a;}
  .pi-icon{font-size:15px;width:22px;text-align:center;flex:0 0 auto;align-self:center;}
  .pi-body{flex:1 1 auto;min-width:0;display:flex;align-items:center;padding:8px 8px 8px 0;}
  .pi-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
  .preset-help{font-size:11px;color:#8b6914;background:#fff8e1;border:1px solid #ffe0b2;border-radius:8px;padding:8px 10px;line-height:1.6;margin-bottom:4px;}
  .design-help{font-size:11px;color:#4a2f8b;background:#f0e9ff;border:1px solid #e1d5f7;border-radius:8px;padding:8px 10px;line-height:1.6;margin-bottom:4px;}
  .event-help{font-size:11px;color:#0d3e6b;background:#e8f4fd;border:1px solid #b3daff;border-radius:8px;padding:8px 10px;line-height:1.6;margin-bottom:4px;}
  .api-help{font-size:11px;color:#880e4f;background:#fff0f5;border:1px solid #f8bbd0;border-radius:8px;padding:8px 10px;line-height:1.6;margin-bottom:4px;}
  .preset-group-head{font-size:11px;font-weight:700;color:#e65100;background:#fff3e0;padding:5px 8px;border-radius:6px;margin-top:6px;letter-spacing:.02em;}
  .api-group-head{font-size:11px;font-weight:700;color:#880e4f;background:#fce4ec;padding:5px 8px;border-radius:6px;margin-top:6px;letter-spacing:.02em;}
  .data-del{flex:0 0 auto;border:none;background:#f0f3f6;color:#8b97a3;border-radius:6px;width:26px;height:26px;line-height:1;font-size:13px;cursor:pointer;align-self:center;margin-right:6px;}
  .data-del:hover{background:#ffe9e6;color:#d0442c;}
  .data-item.missing{opacity:.55;}
  .data-add{display:flex;gap:6px;margin-bottom:4px;flex:0 0 auto;}
  .data-add .act{flex:1 1 auto;font-size:11.5px;padding:7px 4px;}
  .data-empty{font-size:11.5px;color:#a8b3bd;padding:10px 4px;line-height:1.6;}
  .badge-miss{font-size:10px;color:#d0442c;background:#ffeae6;border-radius:4px;padding:1px 4px;margin-left:4px;align-self:center;}
  #workspace{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;background:#eef1f5;display:flex;flex-direction:column;position:relative;}
  #workspace.autoscroll-up::before,
  #workspace.autoscroll-down::after{content:'';position:sticky;left:0;right:0;height:40px;pointer-events:none;z-index:10;}
  #workspace.autoscroll-up::before{top:0;background:linear-gradient(to bottom,rgba(46,196,166,.35),transparent);}
  #workspace.autoscroll-down::after{bottom:0;background:linear-gradient(to top,rgba(46,196,166,.35),transparent);margin-top:-40px;}
  #root-slot{flex:1 1 auto;min-height:100%;padding:14px;background:#fff;border-radius:12px;border:2px solid #e3e9ef;}
  .ws-block{background:#f8fbfd;border:1px solid #dbe2ea;border-left:3px solid #2ec4a6;border-radius:10px;padding:8px;box-shadow:0 1px 2px rgba(20,30,40,.04);transition:box-shadow .12s, outline .12s;}
  .ws-block[data-cat="design"]{border-left-color:#7e57c2;background:#faf8ff;}
  .ws-block[data-cat="api"]{border-left-color:#e91e63;background:#fff8fa;}
  .ws-block.drag-over{outline:2px solid #2ec4a6;outline-offset:1px;}
  .ws-block.mini{display:flex;align-items:center;gap:6px;padding:5px 7px;border-left-color:#9aa7b3;background:#f4f7fa;border-radius:8px;}
  .move-handle{flex:0 0 auto;width:22px;text-align:center;color:#a3b0bc;font-size:14px;cursor:grab;touch-action:none;user-select:none;line-height:1;padding:4px 0;border-radius:5px;font-weight:700;letter-spacing:-2px;padding-left:6px;}
  .move-handle:hover{color:#2ec4a6;background:#e8f8f4;}
  .move-handle:active{cursor:grabbing;color:#1d9e83;background:#c8e8e0;}
  .mini-head{display:flex;align-items:center;gap:4px;flex:0 0 auto;font-size:11.5px;color:#4a5663;}
  .mini-icon{font-size:13px;}
  .mini-name{font-weight:600;}
  .mini-fields{flex:1 1 auto;display:flex;gap:5px;align-items:center;min-width:0;flex-wrap:wrap;}
  .mini-fields .fld-row{flex:1 1 auto;min-width:0;}
  .mini-fields .fld-label{display:none;}
  .mini-fields .fld-hint{display:none;}
  .mini-del{flex:0 0 auto;border:none;background:transparent;color:#b6c0c9;font-size:13px;cursor:pointer;padding:2px 5px;border-radius:5px;}
  .mini-del:hover{background:#ffe9e6;color:#d0442c;}
  .blk-head{display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .blk-icon{font-size:14px;}
  .blk-name{font-size:12.5px;font-weight:700;color:#33404d;}
  .blk-tag{font-size:10.5px;color:#7e8b98;background:#eaeff4;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;}
  .blk-hint{font-size:11px;color:#4a5663;background:#eaf4ff;border-left:3px solid #4a9eff;border-radius:6px;padding:5px 8px;margin-bottom:6px;line-height:1.5;}
  .sp{flex:1 1 auto;}
  .blk-btn{border:none;background:#eef2f6;color:#7a8794;border-radius:6px;width:24px;height:24px;font-size:12px;cursor:pointer;line-height:1;}
  .blk-btn:hover{background:#e0f5f0;color:#1d9e83;}
  .blk-btn[data-act="del"]:hover{background:#ffe9e6;color:#d0442c;}
  .blk-fields{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
  .fld-row{display:flex;align-items:center;gap:4px;padding:1px;border-radius:6px;transition:background .12s, box-shadow .12s;}
  .fld-label{flex:0 0 auto;font-size:11px;color:#7e8b98;min-width:64px;}
  .fld-hint{flex:0 0 auto;font-size:11px;opacity:.35;cursor:help;padding:0 1px;}
  .fld{flex:1 1 auto;min-width:0;width:100%;padding:5px 7px;font-size:12px;border:1px solid #dbe2ea;border-radius:6px;background:#fff;color:#232a31;}
  .fld:focus{outline:none;border-color:#2ec4a6;box-shadow:0 0 0 2px rgba(46,196,166,.15);}
  input[type="color"].fld{padding:1px;height:26px;cursor:pointer;}
  textarea.fld{resize:vertical;min-height:34px;}
  body.preset-drag .fld-hint{opacity:1;}
  .fld-row.preset-target{background:#fff8e1;box-shadow:inset 0 0 0 2px #ffb74d;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{background:#fff8e1;}50%{background:#ffe9c4;}}
  .fld-row.preset-hover{background:#ffe0b2;box-shadow:inset 0 0 0 2px #ff9800;animation:none;}
  .blk-slots{display:flex;flex-direction:column;gap:4px;}
  .slot-row{display:flex;gap:5px;align-items:flex-start;}
  .slot-tag{flex:0 0 auto;font-size:9.5px;font-weight:700;color:#8b97a3;background:#eaeff4;border-radius:4px;padding:3px 5px;margin-top:2px;letter-spacing:.02em;}
  .slot-tag.event-tag{background:#fde8c8;color:#a05a00;}
  .slot{flex:1 1 auto;min-width:0;min-height:30px;padding:5px;border:1.5px dashed #cdd7e0;border-radius:8px;background:#fdfefe;display:flex;flex-direction:column;gap:5px;}
  .slot:empty::after{content:attr(data-empty);font-size:11px;color:#aab5bf;}
  .slot.drag-over{border-color:#2ec4a6;background:#eafaf6;}
  .event-slot{border-color:#f0c67a;background:#fffdf5;}
  .event-slot:empty::after{color:#c49033;}
  .event-slot.drag-over{border-color:#ff9800;background:#fff5e0;}
  #drop-indicator{height:4px;border-radius:2px;background:#2ec4a6;flex:0 0 auto;margin:1px 0;}
  .drag-clone{position:fixed;z-index:9999;pointer-events:none;display:flex;align-items:center;gap:6px;padding:7px 12px;background:#2ec4a6;color:#fff;font-size:12.5px;font-weight:600;border-radius:9px;box-shadow:0 6px 18px rgba(20,30,40,.28);transform:translate(-50%,-50%);opacity:.94;}
  .drag-clone.preset-clone{background:#ff9800;}
  .drag-clone.design-clone{background:#7e57c2;}
  .drag-clone.move-clone{background:#6366f1;}
  .drag-clone.api-clone{background:#e91e63;}
  body.dragging{cursor:grabbing;}
  body.move-dragging{cursor:grabbing;}
  #right{background:#fff;border-left:1px solid #dfe4ea;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .panel-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #eef1f5;}
  .seg{display:flex;background:#eef2f6;border-radius:8px;padding:2px;}
  .seg button{border:none;background:transparent;font-size:11.5px;padding:5px 9px;border-radius:6px;cursor:pointer;color:#5b6875;}
  .seg button.active{background:#fff;color:#1d9e83;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .fullscreen-btn{border:1px solid #dfe4ea;background:#fff;border-radius:8px;padding:5px 9px;font-size:14px;cursor:pointer;color:#5b6875;line-height:1;margin-left:4px;}
  .fullscreen-btn:hover{background:#eef7f5;border-color:#8fd8c8;color:#1d9e83;}
  #preview-area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px;gap:8px;}
  #preview-frame-wrap{flex:1 1 auto;min-height:0;display:flex;justify-content:center;background:#e9edf2;border-radius:9px;padding:6px;overflow:auto;}
  #preview-body{width:100%;height:100%;border:0;background:#fff;border-radius:6px;}
  #preview-body.mobile{width:375px;flex:0 0 auto;border:1px solid #c9d2dc;box-shadow:0 6px 18px rgba(20,30,40,.14);}
  #preview-code{flex:1 1 auto;min-height:0;margin:0;overflow:auto;background:#1f2733;color:#c9e8df;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;padding:10px;border-radius:9px;white-space:pre;user-select:text;-webkit-user-select:text;}
  .hidden{display:none !important;}
  #action-area{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-top:1px solid #eef1f5;max-height:42%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .act{padding:9px 6px;font-size:11.5px;border-radius:8px;border:1px solid #dfe4ea;background:#f8fafc;color:#3b4652;cursor:pointer;transition:.12s;}
  .act:hover{background:#eef7f5;border-color:#8fd8c8;}
  .act.primary{background:#2ec4a6;border-color:#2ec4a6;color:#fff;font-weight:700;}
  .act.primary:hover{background:#26b096;}
  .act.danger{color:#c0392b;border-color:#f0d5d1;}
  .act.danger:hover{background:#ffecea;}
  #modal-overlay{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
  #modal{background:#fff;border-radius:14px;padding:18px;width:min(480px,100%);max-height:82dvh;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  #modal h3{margin:0 0 12px;font-size:15px;}
  .modal-field{display:block;margin-bottom:12px;}
  .modal-field span{display:block;font-size:11.5px;color:#7e8b98;margin-bottom:4px;}
  .modal-field input,.modal-field select{width:100%;padding:9px 10px;border:1px solid #dbe2ea;border-radius:8px;font-size:13px;background:#fff;font-family:inherit;}
  .slot-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .slot-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e3e9ef;border-radius:9px;background:#fbfcfe;}
  .slot-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .slot-info b{font-size:12px;}
  .slot-info span{font-size:11px;color:#8b97a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .slot-item .act{flex:0 0 auto;padding:6px 10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:6px;}
  .modal-msg{font-size:13px;line-height:1.75;color:#3b4652;white-space:pre-wrap;margin:0 0 16px;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:#232a31;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:900;max-width:82vw;text-align:center;}
  #toast.show{opacity:.95;transform:translateX(-50%) translateY(0);}
  #preview-frame-wrap:fullscreen{background:#1f2733;padding:0;border-radius:0;align-items:center;}
  #preview-frame-wrap:fullscreen #preview-body{width:100%;height:100%;border-radius:0;max-width:none;}
  @media (max-width:1100px){#main{grid-template-columns:200px minmax(0,1fr) 300px;}.fld-label{min-width:52px;}}
  @media (max-width:840px){#main{grid-template-columns:170px minmax(0,1fr) 250px;}.tab{padding:5px 9px;font-size:11px;}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="hist-btn" id="btn-undo" disabled><span class="hi">↶</span><span>戻る</span></button>
    <button class="hist-btn" id="btn-redo" disabled><span class="hi">↷</span><span>やり直す</span></button>
    <span class="hist-info" id="hist-info"></span>
  </header>
  <header id="tabbar"></header>
  <div id="main">
    <aside id="palette"><div id="palette-head">かんたん入力</div><div id="palette-list"></div></aside>
    <section id="workspace"><div id="root-slot" class="slot" data-slot="container" data-empty="ここにブロックをドロップ"></div></section>
    <aside id="right">
      <div class="panel-head">
        <div class="seg" id="view-seg"><button data-view="preview" class="active">プレビュー</button><button data-view="code">コード</button></div>
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="seg" id="vp-seg"><button data-vp="desktop" class="active">🖥</button><button data-vp="mobile">📱</button></div>
          <button class="fullscreen-btn" id="btn-fullscreen">⛶</button>
        </div>
      </div>
      <div id="preview-area"><div id="preview-frame-wrap"><iframe id="preview-body"></iframe></div><pre id="preview-code" class="hidden"></pre></div>
      <div id="action-area">
        <button class="act primary" id="btn-export">📄 HTMLエクスポート</button>
        <button class="act" id="btn-import">📥 ファイルインポート</button>
        <button class="act" id="btn-save">💾 セーブ</button>
        <button class="act" id="btn-load">📂 セーブ読み込み</button>
        <button class="act" id="btn-json">⬇ JSON書き出し</button>
        <button class="act" id="btn-settings">⚙ 設定</button>
        <button class="act danger" id="btn-save-reset">🗑 セーブリセット</button>
        <button class="act danger" id="btn-reset">♻ プロジェクトリセット</button>
      </div>
    </aside>
  </div>
</div>
<input type="file" id="file-input" accept="*/*" multiple class="hidden">
<div id="modal-overlay" class="hidden"><div id="modal"></div></div>
<div id="toast"></div>
<div id="drop-indicator" class="hidden"></div>

<script>
(function(){
'use strict';
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r||document).querySelectorAll(s));
function escapeHtml(s){return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer = null;
function toast(msg){const t = $('#toast');t.textContent = msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);}

const CATEGORIES = [
  {id:'presets',     label:'🎁 かんたん',        name:'かんたん入力（プリセット）'},
  {id:'design',      label:'🎨 デザイン',        name:'デザインブロック'},
  {id:'media',       label:'🖼 メディア',        name:'メディア・画像・SVG'},
  {id:'text',        label:'📝 テキスト',        name:'テキスト・見出し'},
  {id:'interactive', label:'🔗 リンク',          name:'リンク・ボタン'},
  {id:'containers',  label:'📦 枠',              name:'枠・レイアウト'},
  {id:'lists',       label:'📋 リスト',          name:'リスト・箇条書き'},
  {id:'tables',      label:'📊 表',              name:'表（テーブル）'},
  {id:'forms',       label:'🧾 フォーム',        name:'フォーム・入力'},
  {id:'css',         label:'🎨 CSS',             name:'CSS・フォント・サイズ'},
  {id:'variables',   label:'🔢 動作',            name:'動作・イベント'},
  {id:'api',         label:'🚀 API・応用',       name:'API・タイマー・デバイス'},
  {id:'data',        label:'📁 データ',          name:'インポートデータ'}
];

const FONT_OPTIONS = [
  {v:'', l:'（指定なし）'},
  {v:"system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif", l:'システム標準'},
  {v:"sans-serif", l:'ゴシック'},{v:"serif", l:'明朝'},{v:"monospace", l:'等幅'},
  {v:"'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif", l:'ヒラギノ/游ゴシック'},

function slotKindOf(type){const d = BLOCKS[type]; if(!d) return null; if(d.cat === 'css') return 'css'; if(d.slotKind) return d.slotKind; return 'block';}
function slotOrder(def){const arr = []; if(def.container) arr.push('container'); (def.slots||[]).forEach(s => { if(s !== 'container') arr.push(s); }); return arr;}

function dataURLToBlob(dataURL){
  try{
    const parts = dataURL.split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    const bstr = atob(parts[1]);
    const u8 = new Uint8Array(bstr.length);
    for(let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }catch(e){ return null; }
}

const MAX_HISTORY = 11;
let historyStack = [];
let historyIndex = -1;
let historyTimer = null;
let historyEnabled = false;
const SNAPSHOT_DELAY = 600;

function captureState(){
  return {
    blocks: childBlocks($('#root-slot')).map(serializeBlock),
    settings: { baseFont: PROJECT_SETTINGS.baseFont || '', baseFontSize: PROJECT_SETTINGS.baseFontSize || '' },
    name: currentProjectName || ''
  };
}
function restoreState(state){
  const root = $('#root-slot');
  root.innerHTML = '';
  (state.blocks || []).forEach(b => { const el = deserializeBlock(b); if(el) root.appendChild(el); });
  PROJECT_SETTINGS.baseFont = (state.settings && state.settings.baseFont) || '';
  PROJECT_SETTINGS.baseFontSize = (state.settings && state.settings.baseFontSize) || '';
  currentProjectName = state.name || '';
  resolveMediaBlocks();
}
function updateHistButtons(){
  const undo = $('#btn-undo'), redo = $('#btn-redo'), info = $('#hist-info');
  if(!undo) return;
  undo.disabled = !(historyIndex > 0);
  redo.disabled = !(historyIndex < historyStack.length - 1);
  if(info) info.textContent = historyStack.length <= 1 ? '' : (historyIndex + ' / ' + (historyStack.length - 1) + ' ステップ');
}
function takeSnapshot(){
  if(!historyEnabled) return;
  const current = captureState();
  if(historyIndex >= 0 && JSON.stringify(historyStack[historyIndex]) === JSON.stringify(current)) return;
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(current);
  if(historyStack.length > MAX_HISTORY) historyStack.shift();
  historyIndex = historyStack.length - 1;
  updateHistButtons();
}
function scheduleSnapshot(){ if(!historyEnabled) return; clearTimeout(historyTimer); historyTimer = setTimeout(takeSnapshot, SNAPSHOT_DELAY); }
function initHistory(){ historyStack = [captureState()]; historyIndex = 0; updateHistButtons(); }
function doUndo(){
  if(historyIndex <= 0) return;
  clearTimeout(historyTimer);
  historyIndex--;
  restoreState(historyStack[historyIndex]);
  updateHistButtons(); schedulePreview(); scheduleSave();
  toast('元に戻しました');
}
function doRedo(){
  if(historyIndex >= historyStack.length - 1) return;
  clearTimeout(historyTimer);
  historyIndex++;
  restoreState(historyStack[historyIndex]);
  updateHistButtons(); schedulePreview(); scheduleSave();
  toast('やり直しました');
}

function makeField(f, val, presetGroup){
  if(f.type === 'hidden'){
    const i = document.createElement('input');
    i.type = 'hidden'; i.className = 'fld'; i.dataset.key = f.k;
    i.value = (val != null ? val : (f.def || ''));
    return i;
  }
  const wrap = document.createElement('label');
  wrap.className = 'fld-row';
  const pg = presetGroup || f.presetGroup;
  if(pg) wrap.dataset.presetGroup = pg;
  if(f.label){const s = document.createElement('span'); s.className = 'fld-label'; s.textContent = f.label; wrap.appendChild(s);}
  if(pg){const hint = document.createElement('span'); hint.className = 'fld-hint'; hint.textContent = '🎁'; wrap.appendChild(hint);}
  let inp;
  if(f.type === 'select'){
    inp = document.createElement('select');
    (f.options || []).forEach(o => {
      const op = document.createElement('option');
      if(o && typeof o === 'object'){ op.value = o.v; op.textContent = o.l; }
      else { op.value = o; op.textContent = o; }
      inp.appendChild(op);
    });
  } else if(f.type === 'textarea'){
    inp = document.createElement('textarea'); inp.rows = 2;
  } else {
    inp = document.createElement('input');
    inp.type = (f.type === 'color') ? 'color' : (f.type === 'number' ? 'number' : 'text');
    if(f.ph) inp.placeholder = f.ph;
  }
  inp.className = 'fld'; inp.dataset.key = f.k;
  let v = (val != null && val !== '') ? val : (f.def != null ? f.def : '');
  if(f.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(v)) v = '#ffffff';
  inp.value = v;
  wrap.appendChild(inp);
  return wrap;
}

function attachMoveDrag(handle, blockEl){
  if(!handle) return;
  handle.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    beginMoveDrag(e, blockEl);
  });
}
function createBlock(type, values){
  const def = BLOCKS[type];
  const el = document.createElement('div');
  el.className = 'ws-block';
  el.dataset.type = type; el.dataset.cat = def.cat;
  const vals = values || {};
  const isMini = (def.cat === 'css' || def.slotKind);

  if(isMini){
    el.classList.add('mini');
    const head = document.createElement('div');
    head.className = 'mini-head';
    head.innerHTML = '<span class="move-handle">⠿</span>' +
      '<span class="mini-icon">' + (def.icon || '▫') + '</span>' +
      '<span class="mini-name">' + escapeHtml(def.label) + '</span>';
    el.appendChild(head);
    const fields = document.createElement('div');
    fields.className = 'mini-fields blk-fields';
    (def.fields || []).forEach(f => fields.appendChild(makeField(f, vals[f.k], def.presetGroup)));
    el.appendChild(fields);
    const del = document.createElement('button');
    del.className = 'mini-del'; del.dataset.act = 'del'; del.type = 'button';
    del.textContent = '✕';
    el.appendChild(del);
    attachMoveDrag(head.querySelector('.move-handle'), el);
    return el;
  }

  const head = document.createElement('div');
  head.className = 'blk-head';
  head.innerHTML =
    '<span class="move-handle">⠿</span>' +
    '<span class="blk-icon">' + (def.icon || '▫') + '</span>' +
    '<span class="blk-name">' + escapeHtml(def.label) + '</span>' +
    '<code class="blk-tag">' + escapeHtml(tagLabel(def)) + '</code>' +
    '<span class="sp"></span>';
  const dup = document.createElement('button');
  dup.className = 'blk-btn'; dup.dataset.act = 'dup'; dup.type = 'button'; dup.textContent = '📋'; dup.title = '複製';
  const del = document.createElement('button');
  del.className = 'blk-btn'; del.dataset.act = 'del'; del.type = 'button'; del.textContent = '✕'; del.title = '削除';
  head.appendChild(dup); head.appendChild(del);
  el.appendChild(head);
  attachMoveDrag(head.querySelector('.move-handle'), el);

  if(def.hint){const h = document.createElement('div'); h.className = 'blk-hint'; h.textContent = '💡 ' + def.hint; el.appendChild(h);}
  if(def.fields && def.fields.length){
    const fw = document.createElement('div');
    fw.className = 'blk-fields';
    def.fields.forEach(f => fw.appendChild(makeField(f, vals[f.k])));
    el.appendChild(fw);
  }
  const slotNames = def.slots || [];
  if(slotNames.length){
    const sw = document.createElement('div');
    sw.className = 'blk-slots';
    slotOrder(def).forEach(sn => {
      if(slotNames.indexOf(sn) < 0) return;
      const row = document.createElement('div');
      row.className = 'slot-row';
      const tag = document.createElement('span');
      tag.className = 'slot-tag' + (sn === 'event' ? ' event-tag' : '');
      tag.textContent = SLOT_LABEL[sn];
      const slot = document.createElement('div');
      slot.className = 'slot ' + sn + '-slot' + (sn === 'event' ? ' event-slot' : '');
      slot.dataset.slot = sn; slot.dataset.empty = SLOT_EMPTY[sn];
      row.appendChild(tag); row.appendChild(slot);
      sw.appendChild(row);
    });
    el.appendChild(sw);
  }
  return el;
}

function getValues(el){const out = {}; el.querySelectorAll(':scope > .blk-fields > .fld, :scope > .blk-fields > .fld-row > .fld').forEach(i => { out[i.dataset.key] = i.value; }); return out;}
function setField(el, key, val){const i = el.querySelector(':scope > .blk-fields > .fld[data-key="' + key + '"], :scope > .blk-fields > .fld-row > .fld[data-key="' + key + '"]'); if(i) i.value = val;}
function getSlot(el, name){return el.querySelector(':scope > .blk-slots > .slot-row > .slot[data-slot="' + name + '"]');}
function childBlocks(slot){return Array.prototype.slice.call(slot.children).filter(c => c.classList && c.classList.contains('ws-block'));}

function serializeBlock(el){
  const values = getValues(el);
  const slots = {};
  ['container','css','var','event'].forEach(sn => {
    const slot = getSlot(el, sn); if(!slot) return;
    const kids = childBlocks(slot).map(serializeBlock);
    if(kids.length) slots[sn] = kids;
  });
  return { type: el.dataset.type, values: values, slots: slots };
}
function deserializeBlock(data){
  if(!data || !BLOCKS[data.type]) return null;
  const el = createBlock(data.type, data.values || {});
  const slots = data.slots || {};
  Object.keys(slots).forEach(sn => {
    const slot = getSlot(el, sn); if(!slot) return;
    slots[sn].forEach(cd => { const c = deserializeBlock(cd); if(c) slot.appendChild(c); });
  });
  return el;
}

  };

  if(!data) return;
  currentProjectName = data.name || '';
  PROJECT_SETTINGS = { baseFont: (data.settings && data.settings.baseFont) || '', baseFontSize: (data.settings && data.settings.baseFontSize) || '' };
  MEDIA.length = 0;
  (data.media || []).forEach(m => {
    let url = '', blob = null;
    if(m.dataURL){ blob = dataURLToBlob(m.dataURL); if(blob) url = URL.createObjectURL(blob); }
    MEDIA.push({ id: 'm' + Math.random().toString(36).slice(2,9), name: m.name, type: m.type, kind: m.kind, url: url, blob: blob, dataURL: m.dataURL || null });
  });
  const root = $('#root-slot');
  root.innerHTML = '';
  (data.blocks || []).forEach(b => { const el = deserializeBlock(b); if(el) root.appendChild(el); });

}
function resolveMediaBlocks(){
  $$('.ws-block').forEach(el => {
    const t = el.dataset.type;
    if(t !== 'img' && t !== 'video' && t !== 'audio') return;
    const v = getValues(el);
    if(!v.media) return;
    const m = MEDIA.filter(x => x.name === v.media && x.url)[0];
    if(m) setField(el, 'src', m.url);
  });
}

function cssStyleOf(el){
  const def = BLOCKS[el.dataset.type];
  const slot = getSlot(el, 'css');
  const parts = [];
  if(def && def.baseStyle) parts.push(def.baseStyle);
  if(slot){
    childBlocks(slot).forEach(c => {
      const d = BLOCKS[c.dataset.type];
      if(!d || !d.cssProp) return;
      const v = getValues(c).value;
      if(v === '' || v == null) return;
      parts.push(d.cssProp + ': ' + v + ';');
    });
  }
  return parts.join(' ');
}
function contentOf(el, v){
  const slot = getSlot(el, 'var');
  if(slot){
    const vb = childBlocks(slot)[0];
    if(vb){
      const vv = getValues(vb);
      if(vb.dataset.type === 'var-static') return escapeHtml(vv.value || '');
      if(vb.dataset.type === 'var-input') return '<span data-bind-input="' + escapeHtml(vv.targetId || '') + '"></span>';
    }
  }
  return escapeHtml(v.text || '');
}

function defaultTrigger(t){
  switch(t){
    case 'evt-live-value': return 'input';
    case 'evt-show-checked': case 'evt-show-selected-text': case 'evt-format-date': return 'change';
    case 'evt-file-to-img': case 'evt-file-to-video': case 'evt-file-to-audio': case 'evt-file-name': return 'change';
    case 'evt-color-to-bg': case 'evt-color-to-text': return 'input';
    case 'evt-range-to-width': case 'evt-range-to-opacity': case 'evt-range-to-fontsize': return 'input';
    case 'evt-progress-set': case 'evt-meter-set': case 'evt-canvas-color': return 'input';
    case 'evt-set-formatted': case 'evt-copy-to-text': case 'evt-calc': case 'evt-join-values': return 'input';
    case 'evt-uppercase': case 'evt-lowercase': case 'evt-trim': return 'input';
    case 'evt-count-chars': case 'evt-number-format': return 'input';
    case 'evt-show-radio': return 'change';
    case 'evt-form-show': return 'submit';
    case 'evt-today-jp': case 'evt-online': case 'evt-video-progress': return 'load';
    default: return 'click';
  }
}

    case 'evt-form-show': {

      return setOut + `var f=document.getElementById(${formId});if(f){var p=[];var els=f.querySelectorAll('input,select,textarea');for(var i=0;i<els.length;i++){var el=els[i];if(['submit','button','reset','file','hidden'].indexOf(el.type)>=0)continue;var n=el.id||el.name||'';var v=(el.type==='checkbox'||el.type==='radio')?(el.checked?'ON':'OFF'):el.value;if(n)p.push(n+'='+v);}S(document.getElementById(${tid}),p.join(' / '));}`;
    }
    case 'evt-form-reset':
      return `var f=document.getElementById(${JSON.stringify(kv.formId||'')});if(f)f.reset();`;

    /* API */
    case 'evt-interval': {
      const ms = Math.max(10, parseInt(kv.interval, 10) || 100);
      const tid2 = JSON.stringify(kv.timerId || 't1');
      if(kv.action === 'stop') return `if(window.__bt&&window.__bt[${tid2}]){clearInterval(window.__bt[${tid2}]);delete window.__bt[${tid2}];}`;
      return `(function(){window.__bt=window.__bt||{};if(window.__bt[${tid2}])clearInterval(window.__bt[${tid2}]);window.__bt[${tid2}]=setInterval(function(){${kv._inner || ''}},${ms});})();`;
    }
    case 'evt-count-up': {
      const act = kv.action || 'start';
      const interval = Math.max(10, parseInt(kv.interval, 10) || 10);
      if(act === 'start') return `(function(){var t=document.getElementById(${tid});if(!t)return;if(t._ci)return;if(t._el==null)t._el=0;t._cs=Date.now()-t._el;t._ci=setInterval(function(){t._el=Date.now()-t._cs;t.textContent=(t._el/1000).toFixed(2);},${interval});})();`;
      if(act === 'stop') return `(function(){var t=document.getElementById(${tid});if(t&&t._ci){clearInterval(t._ci);t._ci=null;}})();`;
      return `(function(){var t=document.getElementById(${tid});if(!t)return;if(t._ci){clearInterval(t._ci);t._ci=null;}t._el=0;t._cs=null;t.textContent='0.00';})();`;
    }
    case 'evt-count-down': {
      const act = kv.action || 'start';
      const sec = parseFloat(kv.seconds) || 10;
      const stopMsg = JSON.stringify(kv.stopMsg || '時間切れ！');
      const pid = JSON.stringify(kv.progressId || '');
      const dur = sec * 1000;
      if(act === 'start') return `(function(){var t=document.getElementById(${tid});var p=document.getElementById(${pid});var dur=${dur};var end=Date.now()+dur;var mx=p?(parseFloat(p.max)||100):100;if(t&&t._ci)clearInterval(t._ci);var tick=function(){var r=(end-Date.now())/dur;if(r<=0){if(t){clearInterval(t._ci);t._ci=null;t.textContent=${stopMsg};}if(p)p.value=mx;return;}if(t)t.textContent=(r*${sec}).toFixed(2);if(p)p.value=(1-r)*mx;};tick();var iv=setInterval(tick,16);if(t)t._ci=iv;else window._cdTimeout=iv;})();`;
      if(act === 'stop') return `(function(){var t=document.getElementById(${tid});if(t&&t._ci){clearInterval(t._ci);t._ci=null;}if(window._cdTimeout){clearInterval(window._cdTimeout);window._cdTimeout=null;}})();`;
      return `(function(){var t=document.getElementById(${tid});var p=document.getElementById(${pid});if(t){if(t._ci){clearInterval(t._ci);t._ci=null;}t.textContent='${sec.toFixed(2)}';}if(p)p.value=0;})();`;
    }
    case 'evt-countdown-bar': {
      const act = kv.action || 'start';
      const sec = parseFloat(kv.seconds) || 10;
      const pid = JSON.stringify(kv.progressId || '');
      const dur = sec * 1000;
      if(act === 'start') return `(function(){var t=document.getElementById(${tid});var p=document.getElementById(${pid});if(!p&&!t)return;var dur=${dur};var end=Date.now()+dur;var mx=p?(parseFloat(p.max)||100):100;if(window._cbarIv)clearInterval(window._cbarIv);var tick=function(){var r=(end-Date.now())/dur;if(r<=0){clearInterval(window._cbarIv);window._cbarIv=null;if(t)t.textContent='0.00';if(p)p.value=mx;return;}if(t)t.textContent=(r*${sec}).toFixed(2);if(p)p.value=(1-r)*mx;};tick();window._cbarIv=setInterval(tick,16);})();`;
      if(act === 'stop') return `if(window._cbarIv){clearInterval(window._cbarIv);window._cbarIv=null;}`;
      return `(function(){if(window._cbarIv){clearInterval(window._cbarIv);window._cbarIv=null;}var t=document.getElementById(${tid});var p=document.getElementById(${pid});if(t)t.textContent='${sec.toFixed(2)}';if(p)p.value=0;})();`;
    }
    case 'evt-stopwatch': {
      const act = kv.action || 'start';
      if(act === 'start') return `(function(){var t=document.getElementById(${tid});if(!t)return;if(t._ci)return;if(t._el==null)t._el=0;t._cs=Date.now()-t._el;t._ci=setInterval(function(){t._el=Date.now()-t._cs;t.textContent=(t._el/1000).toFixed(2);},10);})();`;
      if(act === 'stop') return `(function(){var t=document.getElementById(${tid});if(t&&t._ci){clearInterval(t._ci);t._ci=null;}})();`;
      return `(function(){var t=document.getElementById(${tid});if(!t)return;if(t._ci){clearInterval(t._ci);t._ci=null;}t._el=0;t._cs=null;t.textContent='0.00';})();`;
    }
    case 'evt-delay': {
      const ms = parseInt(kv.ms, 10) || 1000;
      return setOut + `setTimeout(function(){S(document.getElementById(${tid}),${JSON.stringify(kv.msg || '実行')});},${ms});`;
    }
    case 'evt-progress-num': {
      const val = parseFloat(kv.value) || 0;
      return `var t=document.getElementById(${tid});if(t)t.value=${val};`;
    }
    case 'evt-progress-add': {
      const step = parseFloat(kv.step) || 10;
      return `var t=document.getElementById(${tid});if(t){var v=(parseFloat(t.value)||0)+(${step});var mx=parseFloat(t.max)||100;if(v<0)v=0;if(v>mx)v=mx;t.value=v;}`;
    }
    case 'evt-progress-timed': {
      const pid = JSON.stringify(kv.progressId || toId || '');
      const dur = Math.max(50, parseInt(kv.durationMs, 10) || 5000);
      const txid = JSON.stringify(kv.textId || '');
      return `(function(){var p=document.getElementById(${pid});var tx=document.getElementById(${txid});if(!p&&!tx)return;var mx=p?(parseFloat(p.max)||100):100;var t0=Date.now();if(window._ptimIv)clearInterval(window._ptimIv);if(p)p.value=0;var tick=function(){var t=Date.now()-t0;var r=Math.min(t/${dur},1);if(p)p.value=r*mx;if(tx)tx.textContent=(((${dur}-t)/1000>0?((${dur}-t)/1000):0)).toFixed(1);if(r>=1){clearInterval(window._ptimIv);window._ptimIv=null;if(tx)tx.textContent='0.0';}};tick();window._ptimIv=setInterval(tick,16);})();`;
    }
    case 'evt-video-progress': {
      const vid = JSON.stringify(kv.videoId || '');
      const pid = JSON.stringify(kv.progressId || '');
      return `(function(){var v=document.getElementById(${vid}),p=document.getElementById(${pid});if(!v||!p)return;var mx=parseFloat(p.max)||100;if(!p.hasAttribute('max'))p.max=mx;var up=function(){if(v.duration&&!isNaN(v.duration)&&v.duration>0){p.value=(v.currentTime/v.duration)*mx;}};v.addEventListener('timeupdate',up);v.addEventListener('loadedmetadata',up);v.addEventListener('seeked',up);v.addEventListener('play',up);if(v.readyState>=1)up();})();`;
    }
    case 'evt-meter-num': {
      const val = parseFloat(kv.value) || 0;
      return `var t=document.getElementById(${tid});if(t)t.value=${val};`;
    }
    case 'evt-meter-add': {
      const step = parseFloat(kv.step) || 10;
      return `var t=document.getElementById(${tid});if(t){var v=(parseFloat(t.value)||0)+(${step});var mn=parseFloat(t.min)||0;var mx=parseFloat(t.max)||100;if(v<mn)v=mn;if(v>mx)v=mx;t.value=v;}`;
    }
    case 'evt-copy-clipboard':
      return `(function(){var s=document.getElementById(${fid});if(!s)return;var txt=s.value!=null?s.value:s.textContent;if(navigator.clipboard)navigator.clipboard.writeText(txt);})();`;
    case 'evt-share': {
      const tt = JSON.stringify(kv.title || '共有');
      const tx = JSON.stringify(kv.text || '');
      const ur = kv.url ? JSON.stringify(kv.url) : 'location.href';
      return `(function(){if(!navigator.share)return;navigator.share({title:${tt},text:${tx},url:${ur}}).catch(function(){});})();`;
    }
    case 'evt-vibrate': {
      const ms = parseInt(kv.ms, 10) || 200;
      return `if(navigator.vibrate)navigator.vibrate(${ms});`;
    }
    case 'evt-geolocation':
      return setOut + `(function(){var t=document.getElementById(${tid});if(!navigator.geolocation){S(t,'未対応');return;}S(t,'取得中...');navigator.geolocation.getCurrentPosition(function(p){S(t,'緯度:'+p.coords.latitude.toFixed(4)+' 経度:'+p.coords.longitude.toFixed(4));},function(e){S(t,'取得失敗: '+e.message);});})();`;
    case 'evt-battery':
      return setOut + `(function(){var t=document.getElementById(${tid});if(!navigator.getBattery&&!navigator.battery){S(t,'未対応');return;}var b=navigator.getBattery?navigator.getBattery():Promise.resolve(navigator.battery);b.then(function(bat){S(t,'残量: '+Math.round(bat.level*100)+'% / '+(bat.charging?'充電中':'充電なし'));}).catch(function(){S(t,'取得失敗');});})();`;
    case 'evt-online':
      return setOut + `var t=document.getElementById(${tid});S(t,navigator.onLine?'オンライン':'オフライン');window.addEventListener('online',function(){S(t,'オンライン');});window.addEventListener('offline',function(){S(t,'オフライン');});`;
    case 'evt-fetch': {
      const url = JSON.stringify(kv.url || '');
      const keyStr = kv.key ? JSON.stringify(kv.key) : 'null';
      return setOut + `(function(){var t=document.getElementById(${tid});S(t,'読込中...');fetch(${url}).then(function(r){return r.text();}).then(function(txt){var out=txt;try{var d=JSON.parse(txt);var k=${keyStr};if(k&&d&&typeof d==='object'&&k in d){out=d[k];}else if(typeof d==='object'&&d!==null){out=txt;}else{out=String(d);}}catch(e){}if(out&&typeof out==='object')out=JSON.stringify(out);S(t,String(out));}).catch(function(e){S(t,'エラー: '+(e&&e.message?e.message:'取得失敗'));});})();`;
    }
    case 'evt-beep': {
      const freq = parseFloat(kv.freq) || 440;
      const ms = parseInt(kv.ms, 10) || 200;
      return `(function(){try{var ctx=window.__audioCtx||(window.__audioCtx=new (window.AudioContext||window.webkitAudioContext)());var o=ctx.createOscillator();var g=ctx.createGain();o.type='sine';o.frequency.value=${freq};o.connect(g);g.connect(ctx.destination);g.gain.value=0.1;o.start();setTimeout(function(){o.stop();},${ms});}catch(e){}})();`;
    }
    case 'evt-speech': {
      const text = JSON.stringify(kv.text || '');
      return `(function(){try{if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(${text});u.lang='ja-JP';speechSynthesis.speak(u);}catch(e){}})();`;
    }
    case 'evt-local-save':
      return `(function(){var s=document.getElementById(${fid});if(!s)return;var txt=s.value!=null?s.value:s.textContent;try{localStorage.setItem(${JSON.stringify(kv.key||'mydata')},txt);}catch(e){}})();`;
    case 'evt-local-load':
      return setOut + `(function(){var t=document.getElementById(${tid});try{S(t,localStorage.getItem(${JSON.stringify(kv.key||'mydata')})||'（データなし）');}catch(e){S(t,'読込失敗');}})();`;
    case 'evt-local-delete':
      return `try{localStorage.removeItem(${JSON.stringify(kv.key||'mydata')});}catch(e){}`;
    case 'evt-notification': {
      const title = JSON.stringify(kv.title || 'お知らせ');
      const body = JSON.stringify(kv.body || '');
      return `(function(){if(!('Notification' in window))return;if(Notification.permission==='granted'){new Notification(${title},{body:${body}});}else if(Notification.permission!=='denied'){Notification.requestPermission().then(function(p){if(p==='granted')new Notification(${title},{body:${body}});});}})();`;
    }
    case 'evt-download-text': {
      const fn = JSON.stringify(kv.filename || 'memo.txt');
      return `(function(){var s=document.getElementById(${fid});var txt=s?(s.value!=null?s.value:s.textContent):'';var blob=new Blob([txt],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=${fn};document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);})();`;
    }
    case 'evt-download-canvas': {
      const fn = JSON.stringify(kv.filename || 'art.png');
      return `(function(){var c=document.getElementById(${tid});if(!c||!c.toDataURL)return;var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=${fn};document.body.appendChild(a);a.click();a.remove();})();`;
    }
    case 'evt-fade-in': {
      const ms = parseInt(kv.ms, 10) || 500;
      return `(function(){var t=document.getElementById(${tid});if(!t)return;t.style.transition='opacity ${ms}ms ease';t.style.opacity='0';setTimeout(function(){t.style.opacity='1';},30);})();`;
    }
    case 'evt-shake':
      return `(function(){var t=document.getElementById(${tid});if(!t)return;var s=0;var id=setInterval(function(){s++;var x=(s%2?-1:1)*8;t.style.transform='translateX('+x+'px)';if(s>6){clearInterval(id);t.style.transform='';}},50);})();`;
    case 'evt-random-color':
      return `(function(){var t=document.getElementById(${tid});if(!t)return;var h=Math.floor(Math.random()*360);t.style.backgroundColor='hsl('+h+',70%,60%)';})();`;
    case 'evt-random-number': {
      const min = parseFloat(kv.min) || 0, max = parseFloat(kv.max) || 100;
      return setOut + `S(document.getElementById(${tid}),Math.floor(Math.random()*(${max}-${min}+1))+${min});`;
    }
  }
  return '';
}

function collectEvents(el, v, events, loadEvents, warnings){
  const slot = getSlot(el, 'event');
  if(!slot) return;
  const kids = childBlocks(slot);
  if(!kids.length) return;
  const owner = v.id || '';
  kids.forEach(k => {
    const kv = getValues(k);
    const t = k.dataset.type;
    if(t === 'evt-prevent-submit'){
      if(!owner){ warnings.push('イベント対象に ID がありません'); return; }
      events.push(`document.getElementById(${JSON.stringify(owner)})?.addEventListener("submit",function(e){e.preventDefault();});`);
      return;
    }
    if(t === 'evt-interval') kv._inner = 'window.__btick=window.__btick||0;';
    const trigger = kv.trigger || defaultTrigger(t);
    const body = eventBody(t, kv, owner);
    if(!body) return;
    if(trigger === 'load'){ loadEvents.push(body); return; }
    if(!owner && t !== 'evt-show-radio'){
      if(['evt-count-up','evt-count-down','evt-countdown-bar','evt-stopwatch','evt-interval','evt-delay','evt-fetch','evt-geolocation','evt-battery','evt-online','evt-copy-clipboard','evt-vibrate','evt-beep','evt-speech','evt-notification','evt-local-save','evt-local-delete','evt-random-color','evt-shake','evt-fade-in','evt-random-number','evt-scroll-top','evt-page-reload','evt-print','evt-share'].indexOf(t) >= 0){
        loadEvents.push(body); return;
      }
      warnings.push('動作ブロックの対象に ID がありません'); return;
    }
    const listener = (trigger === 'input') ? 'input' : (trigger === 'change') ? 'change' : (trigger === 'submit') ? 'submit' : 'click';
    if(!owner){
      if(listener === 'change') loadEvents.push(`document.querySelectorAll('input[type=radio]').forEach(function(r){r.addEventListener('change',function(){${body}});});`);
      return;
    }
    if(listener === 'submit'){
      events.push(`document.getElementById(${JSON.stringify(owner)})?.addEventListener("submit",function(e){e.preventDefault();${body}});`);
    } else {
      events.push(`document.getElementById(${JSON.stringify(owner)})?.addEventListener("${listener}",function(){${body}});`);
    }
  });
}

function attrStr(a){ return a.length ? ' ' + a.join(' ') : ''; }

function genNode(el, depth, events, loadEvents, warnings, mediaMap){
  const type = el.dataset.type;
  const def = BLOCKS[type]; if(!def) return '';
  const pad = '  '.repeat(depth);
  const v = getValues(el);
  const style = cssStyleOf(el);
  const attrs = [];
  const pushStyle = () => { if(style) attrs.push('style="' + escapeHtml(style) + '"'); };
  const resolveSrc = src => (mediaMap && v.media && mediaMap[v.media]) ? mediaMap[v.media] : (src || '');

  if(def.container){
    let inner = '';
    const slot = getSlot(el, 'container');
    if(slot){ childBlocks(slot).forEach(c => { inner += genNode(c, depth + 1, events, loadEvents, warnings, mediaMap); }); }
    if(!def.emptyOk && !inner.trim()){ warnings.push(def.label + ' の中身が空のためスキップ'); return ''; }
    if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
    if(type === 'label' && v.for) attrs.push('for="' + escapeHtml(v.for) + '"');
    if(type === 'details' && v.open === 'open') attrs.push('open');
    if(type === 'ol' && v.start && v.start !== '1') attrs.push('start="' + escapeHtml(v.start) + '"');
    pushStyle();
    collectEvents(el, v, events, loadEvents, warnings);
    if(type === 'html-raw'){
      return pad + '<div' + attrStr(attrs) + '>' + (v.raw || '') + (inner ? '\n' + inner + pad : '') + '</div>\n';
    }
    return pad + '<' + def.tag + attrStr(attrs) + '>\n' + inner + pad + '</' + def.tag + '>\n';
  }

  if(def.textTag){
    if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
    if(v.href) attrs.push('href="' + escapeHtml(v.href) + '"');
    if(v.target) attrs.push('target="' + escapeHtml(v.target) + '"');
    if(v.datetime) attrs.push('datetime="' + escapeHtml(v.datetime) + '"');
    if(v.value != null && v.value !== '' && type === 'li') attrs.push('value="' + escapeHtml(v.value) + '"');
    if(type === 'a' && v.target === '_blank') attrs.push('rel="noopener"');
    if((type === 'th' || type === 'td') && v.colspan) attrs.push('colspan="' + escapeHtml(v.colspan) + '"');
    pushStyle();
    collectEvents(el, v, events, loadEvents, warnings);
    return pad + '<' + def.tag + attrStr(attrs) + '>' + contentOf(el, v) + '</' + def.tag + '>\n';
  }

  switch(type){
    case 'br': return pad + '<br>\n';
    case 'hr': pushStyle(); return pad + '<hr' + attrStr(attrs) + '>\n';
    case 'img': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      const s = resolveSrc(v.src);
      if(s) attrs.push('src="' + escapeHtml(s) + '"');
      if(v.alt) attrs.push('alt="' + escapeHtml(v.alt) + '"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<img' + attrStr(attrs) + '>\n';
    }
    case 'video': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      const s = resolveSrc(v.src);
      if(s) attrs.push('src="' + escapeHtml(s) + '"');
      attrs.push('controls', 'playsinline');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<video' + attrStr(attrs) + '></video>\n';
    }
    case 'audio': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      const s = resolveSrc(v.src);
      if(s) attrs.push('src="' + escapeHtml(s) + '"');
      attrs.push('controls');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<audio' + attrStr(attrs) + '></audio>\n';
    }
    case 'iframe': {
      if(v.src) attrs.push('src="' + escapeHtml(v.src) + '"');
      if(v.w) attrs.push('width="' + escapeHtml(v.w) + '"');
      if(v.h) attrs.push('height="' + escapeHtml(v.h) + '"');
      attrs.push('frameborder="0"', 'allowfullscreen');
      pushStyle(); return pad + '<iframe' + attrStr(attrs) + '></iframe>\n';
    }
    case 'canvas': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.w) attrs.push('width="' + escapeHtml(v.w) + '"');
      if(v.h) attrs.push('height="' + escapeHtml(v.h) + '"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<canvas' + attrStr(attrs) + '></canvas>\n';
    }
    case 'svg': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.w) attrs.push('width="' + escapeHtml(v.w) + '"');
      if(v.h) attrs.push('height="' + escapeHtml(v.h) + '"');
      attrs.push('xmlns="http://www.w3.org/2000/svg"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<svg' + attrStr(attrs) + '>' + (v.inner || '') + '</svg>\n';
    }
    case 'progress': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value !== '' && v.value != null) attrs.push('value="' + escapeHtml(v.value) + '"');
      if(v.max) attrs.push('max="' + escapeHtml(v.max) + '"');
      pushStyle(); return pad + '<progress' + attrStr(attrs) + '></progress>\n';
    }
    case 'meter': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value !== '' && v.value != null) attrs.push('value="' + escapeHtml(v.value) + '"');
      if(v.min) attrs.push('min="' + escapeHtml(v.min) + '"');
      if(v.max) attrs.push('max="' + escapeHtml(v.max) + '"');
      pushStyle(); return pad + '<meter' + attrStr(attrs) + '></meter>\n';
    }
    case 'heading': {
      const lv = v.level || '2';
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<h' + lv + attrStr(attrs) + '>' + contentOf(el, v) + '</h' + lv + '>\n';
    }
    case 'button': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value != null && v.value !== '') attrs.push('value="' + escapeHtml(v.value) + '"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<button type="button"' + attrStr(attrs) + '>' + contentOf(el, v) + '</button>\n';
    }
    case 'submit': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value != null && v.value !== '') attrs.push('value="' + escapeHtml(v.value) + '"');
      attrs.push('type="submit"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<button' + attrStr(attrs) + '>' + contentOf(el, v) + '</button>\n';
    }
    case 'reset': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      attrs.push('type="reset"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<button' + attrStr(attrs) + '>' + contentOf(el, v) + '</button>\n';
    }
    case 'input-text': case 'input-password': case 'input-email': case 'input-url': {
      const typeMap = { 'input-text':'text', 'input-password':'password', 'input-email':'email', 'input-url':'url' };
      attrs.push('type="' + typeMap[type] + '"');

      return pad + '<label><input' + attrStr(attrs) + '> ' + escapeHtml(v.label || '') + '</label>\n';
    }
    case 'radio': {
      attrs.push('type="radio"');

    }
    case 'select': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle(); collectEvents(el, v, events, loadEvents, warnings);
      const opts = String(v.options || '').split('\n').map(o => o.trim()).filter(Boolean);
      let inner = '';
      opts.forEach(o => { inner += '\n' + pad + '  <option>' + escapeHtml(o) + '</option>'; });
      return pad + '<select' + attrStr(attrs) + '>' + inner + '\n' + pad + '</select>\n';
    }
    case 'optgroup': {
      if(v.label) attrs.push('label="' + escapeHtml(v.label) + '"');
      const opts = String(v.options || '').split('\n').map(o => o.trim()).filter(Boolean);

    }
  }
  return '';
}

function runtimeScript(events, loadEvents){
  const lines = [
    'document.addEventListener("input", function(e){',
    '  if(e.target && e.target.id){',
    '    var nodes = document.querySelectorAll(\'[data-bind-input="\' + e.target.id + \'"]\');',
    '    for(var i = 0; i < nodes.length; i++){ nodes[i].textContent = e.target.value; }',
    '  }',
    '});',
    'window.__vars = window.__vars || {};',
    'function __initBlockEvents(){'
  ];
  events.forEach(e => lines.push('  ' + e));
  loadEvents.forEach(e => lines.push('  ' + e));
  lines.push('}');
  lines.push('if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", __initBlockEvents); } else { __initBlockEvents(); }');
  return lines.join('\n');
}
function bodyStyleAttr(){
  const p = [];
  if(PROJECT_SETTINGS.baseFont) p.push('font-family: ' + PROJECT_SETTINGS.baseFont + ';');
  if(PROJECT_SETTINGS.baseFontSize) p.push('font-size: ' + PROJECT_SETTINGS.baseFontSize + ';');
  return p.length ? ' style="' + escapeHtml(p.join(' ')) + '"' : '';
}
function generateHTML(opts){
  opts = opts || {};
  const events = []; const loadEvents = []; const warnings = [];
  const mediaMap = opts.mediaMap || null;
  let body = '';
  childBlocks($('#root-slot')).forEach(c => { body += genNode(c, 1, events, loadEvents, warnings, mediaMap); });
  const title = currentProjectName || 'My Page';
  const script = runtimeScript(events, loadEvents).replace(/<\//g, '<\\/');
  const html = [
    '<!DOCTYPE html>','<html lang="ja">','<head>',
    '<meta charset="UTF-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
    '<title>' + escapeHtml(title) + '</title>','</head>',
    '<body' + bodyStyleAttr() + '>',
    body.replace(/\n$/, ''),
    '<script>', script, '<\/script>','</body>','</html>'
  ].join('\n');
  return { html: html, warnings: warnings };
}

let drag = null;
const indicator = document.getElementById('drop-indicator');
let autoScrollRAFId = null;
let lastPointerX = 0, lastPointerY = 0;
const AUTO_SCROLL_EDGE = 80;
const AUTO_SCROLL_SPEED = 22;

function startAutoScroll(){
  if(autoScrollRAFId) return;
  const tick = function(){
    if(!drag || !drag.active){
      autoScrollRAFId = null;
      const ws = $('#workspace'); if(ws) ws.classList.remove('autoscroll-up','autoscroll-down');
      return;
    }
    performAutoScroll(lastPointerY);
    autoScrollRAFId = requestAnimationFrame(tick);
  };
  autoScrollRAFId = requestAnimationFrame(tick);
}
function performAutoScroll(y){
  const ws = $('#workspace'), pal = $('#palette-list');
  const EDGE = AUTO_SCROLL_EDGE, SPEED = AUTO_SCROLL_SPEED;
  if(ws){
    const r = ws.getBoundingClientRect();
    let amt = 0, ind = '';
    if(y >= r.top && y <= r.bottom){
      if(y < r.top + EDGE){ const k=(r.top+EDGE-y)/EDGE; amt=-SPEED*(0.4+k); ind='up'; }
      else if(y > r.bottom - EDGE){ const k=(y-(r.bottom-EDGE))/EDGE; amt=SPEED*(0.4+k); ind='down'; }
    } else if(y < r.top && y > r.top-220){ amt=-SPEED*1.6; ind='up'; }
    else if(y > r.bottom && y < r.bottom+220){ amt=SPEED*1.6; ind='down'; }
    ws.classList.toggle('autoscroll-up', ind==='up');
    ws.classList.toggle('autoscroll-down', ind==='down');
    if(amt !== 0){
      const before = ws.scrollTop;
      ws.scrollTop += amt;
      if(ws.scrollTop !== before && drag && drag.active){
        const t = findTarget(lastPointerX, lastPointerY);
        if(t){ drag.target = t; highlight(t); }
      }
    }
  }
  if(pal){
    const r = pal.getBoundingClientRect();
    let amt = 0;
    if(y >= r.top && y <= r.bottom){
      if(y < r.top + EDGE){ const k=(r.top+EDGE-y)/EDGE; amt=-SPEED*(0.4+k); }
      else if(y > r.bottom - EDGE){ const k=(y-(r.bottom-EDGE))/EDGE; amt=SPEED*(0.4+k); }
    }
    if(amt !== 0) pal.scrollTop += amt;
  }
}

function beginDrag(e, payload, srcEl){
  if(drag) return;
  drag = { mode:'new', payload, srcEl, x0:e.clientX, y0:e.clientY, id:e.pointerId, active:false, target:null, lastSlot:null, lastRef:null, lastBlock:null, lastField:null, clone:null };
}
function beginMoveDrag(e, blockEl){
  if(drag) return;
  const type = blockEl.dataset.type;
  const def = BLOCKS[type];
  drag = { mode:'move', movingBlock:blockEl,
    payload: { kind:'move', type:type, label:def?def.label:'ブロック', icon:def?(def.icon||'📦'):'📦' },
    srcEl: blockEl, x0:e.clientX, y0:e.clientY, id:e.pointerId, active:false, target:null, lastSlot:null, lastRef:null, lastBlock:null, lastField:null, clone:null };
}
function activateDrag(){
  drag.active = true;
  const c = document.createElement('div');
  c.className = 'drag-clone';
  if(drag.payload.kind === 'preset') c.classList.add('preset-clone');
  else if(drag.mode === 'move') c.classList.add('move-clone');

function kindFromType(type, name){
  if(type && /^image\//.test(type)) return 'img';
  if(type && /^video\//.test(type)) return 'video';
  if(type && /^audio\//.test(type)) return 'audio';
  const ext = (name || '').split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','gif','webp','svg','bmp','heic'].indexOf(ext) >= 0) return 'img';
  if(['mp4','mov','webm','m4v','ogv'].indexOf(ext) >= 0) return 'video';
  return 'audio';
}
function mimeFromName(name){
  const ext = (name || '').split('.').pop().toLowerCase();
  const map = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml', mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm', mp3:'audio/mpeg', wav:'audio/wav', m4a:'audio/mp4', ogg:'audio/ogg' };
  return map[ext] || 'application/octet-stream';
}
function addMedia(file){

  const kind = kindFromType(file.type, file.name);
  let target;
  if(existing){
    existing.url = url; existing.blob = file;
    existing.type = file.type || existing.type; existing.kind = kind;
    target = existing;
  } else {
    target = { id:'m'+Math.random().toString(36).slice(2,9), name:file.name, type:file.type||mimeFromName(file.name), kind, url, blob:file, dataURL:null };
    MEDIA.push(target);

  reader.onload = function(){ target.dataURL = reader.result; scheduleSave(); };

}

const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }

function buildZip(entries){

    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true); lv.setUint16(8,0,true); lv.setUint16(10,0,true); lv.setUint16(12,0,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nameBytes.length,true); lv.setUint16(28,0,true);
    local.set(nameBytes,30);
    parts.push(local); parts.push(data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true); cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(30,0,true); cv.setUint16(32,0,true); cv.setUint16(34,0,true); cv.setUint16(36,0,true);

async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined') throw new Error('解凍非対応');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readZip(arrayBuffer){
  const u8 = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  let eocd = -1;
  const minPos = Math.max(0, u8.length - 22 - 65535);
  for(let i = u8.length - 22; i >= minPos; i--){ if(dv.getUint32(i,true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('ZIPとして読み込めません');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true);
    const clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off+46, off+46+nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const dataStart = lho + 30 + lnlen + lelen;
    const raw = u8.subarray(dataStart, dataStart + csize);
    let data;
    if(method === 0) data = raw.slice();
    else if(method === 8) data = await inflateRaw(raw);
    else throw new Error('未対応圧縮');
    out.push({ name, data });
    off += 46 + nlen + elen + clen;
  }
  return out;
}
function download(filename, blob){

function collectUsedMediaNames(){

    let info = null;
    try{ info = JSON.parse(localStorage.getItem(LS_SLOT(i)) || 'null'); }catch(e){}
    rows += '<div class="slot-item"><div class="slot-info"><b>スロット ' + i + '</b><span>' + (info ? escapeHtml(info.name) + ' / ' + new Date(info.date).toLocaleString('ja-JP') : '（空き）') + '</span></div><button class="act" type="button" data-save-slot="' + i + '">ここに保存</button></div>';
  }
  openModal('<h3>プロジェクトをセーブ</h3><label class="modal-field"><span>プロジェクト名</span><input id="save-name" type="text" value="' + escapeHtml(currentProjectName || '') + '" placeholder="例：自己紹介ページ"></label><div class="slot-list">' + rows + '</div><div class="modal-actions"><button class="act" type="button" data-close>閉じる</button></div>');
}
function openSaveModalLoad(){
  let rows = ''; let any = false;
  for(let i=1;i<=5;i++){
    let info = null;
    try{ info = JSON.parse(localStorage.getItem(LS_SLOT(i)) || 'null'); }catch(e){}
    if(info) any = true;
    rows += '<div class="slot-item"><div class="slot-info"><b>スロット ' + i + '</b><span>' + (info ? escapeHtml(info.name) + ' / ' + new Date(info.date).toLocaleString('ja-JP') : '（空き）') + '</span></div>' + (info ? '<button class="act" type="button" data-load-slot="' + i + '">読込</button><button class="act danger" type="button" data-del-slot="' + i + '">削除</button>' : '') + '</div>';
  }
  openModal('<h3>セーブデータを読み込む</h3><div class="slot-list">' + rows + '</div>' + (any ? '' : '<p style="font-size:12px;color:#8b97a3;">保存されたデータがありません。</p>') + '<div class="modal-actions"><button class="act" type="button" data-close>閉じる</button></div>');
}
$('#modal').addEventListener('click', function(e){
  const saveBtn = e.target.closest('[data-save-slot]');
  if(saveBtn){
    const slot = saveBtn.dataset.saveSlot;
    const nameEl = $('#save-name');
    const name = (nameEl && nameEl.value.trim()) || ('プロジェクト ' + slot);
    const exist = localStorage.getItem(LS_SLOT(slot));
    const doSave = function(){
      currentProjectName = name;
      try{
        localStorage.setItem(LS_SLOT(slot), JSON.stringify({ name, date: new Date().toISOString(), data: projectData() }));
        toast('スロット ' + slot + ' にセーブしました'); closeModal();
      }catch(err){
        try{
          const d = projectData();
          d.media = d.media.map(m => ({ name: m.name, type: m.type, kind: m.kind, dataURL: null }));
          localStorage.setItem(LS_SLOT(slot), JSON.stringify({ name, date: new Date().toISOString(), data: d }));
          toast('⚠ 容量オーバーのため画像なしで保存しました'); closeModal();
        }catch(e2){ toast('セーブに失敗しました'); }
      }
    };
    if(exist) showConfirm('スロット ' + slot + ' に上書きしますか？', doSave);
    else doSave();
    return;
  }
  const loadBtn = e.target.closest('[data-load-slot]');
  if(loadBtn){
    try{
      const info = JSON.parse(localStorage.getItem(LS_SLOT(loadBtn.dataset.loadSlot)) || 'null');
      if(!info) return;
      loadProjectData(info.data);
      toast('「' + info.name + '」を読み込みました');
      closeModal();
    }catch(err){ toast('読み込みに失敗'); }
    return;
  }
  const delBtn = e.target.closest('[data-del-slot]');
  if(delBtn){
    const slot = delBtn.dataset.delSlot;
    showConfirm('スロット ' + slot + ' を削除しますか？', function(){
      localStorage.removeItem(LS_SLOT(slot));
      openSaveModalLoad();
    });
  }
});
$('#btn-export').addEventListener('click', exportHTML);
$('#btn-json').addEventListener('click', exportJSON);
$('#btn-import').addEventListener('click', () => $('#file-input').click());
$('#btn-save').addEventListener('click', openSaveModal);
$('#btn-load').addEventListener('click', openSaveModalLoad);
$('#btn-settings').addEventListener('click', openSettingsModal);
$('#file-input').addEventListener('change', function(e){
  const files = Array.prototype.slice.call(e.target.files || []);
  if(files.length) handleFiles(files);
  e.target.value = '';
});
$('#btn-save-reset').addEventListener('click', function(){
  showConfirm('警告：全てのセーブデータ（スロット1〜5）を削除します。\nよろしいですか？', function(){
    for(let i=1;i<=5;i++) localStorage.removeItem(LS_SLOT(i));
    toast('セーブデータを全て削除しました');
  });
});
$('#btn-reset').addEventListener('click', function(){
  showConfirm('警告：作成中のプロジェクトを白紙に戻します。\n（この操作は取り消せません）', function(){
    $('#root-slot').innerHTML = '';
    currentProjectName = '';
    PROJECT_SETTINGS = { baseFont:'', baseFontSize:'' };
    afterChange();
    toast('プロジェクトをリセットしました');
  });
});
$('#view-seg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  $$('#view-seg button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const isPreview = b.dataset.view === 'preview';
  $('#preview-frame-wrap').classList.toggle('hidden', !isPreview);
  $('#preview-code').classList.toggle('hidden', isPreview);
  if(isPreview) updatePreview();
});
$('#vp-seg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  $$('#vp-seg button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $('#preview-body').classList.toggle('mobile', b.dataset.vp === 'mobile');
});
$('#btn-fullscreen').addEventListener('click', function(){
  const el = $('#preview-frame-wrap');
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen) el.msRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
});
function updateFullscreenBtn(){
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('#btn-fullscreen').textContent = isFs ? '⛶✕' : '⛶';
}
document.addEventListener('fullscreenchange', updateFullscreenBtn);
document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
$('#btn-undo').addEventListener('click', doUndo);
$('#btn-redo').addEventListener('click', doRedo);
document.addEventListener('keydown', function(e){
  if(!(e.ctrlKey || e.metaKey)) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if(e.key === 'z' && !e.shiftKey){ e.preventDefault(); doUndo(); }
  else if((e.key === 'z' && e.shiftKey) || e.key === 'y'){ e.preventDefault(); doRedo(); }
});
function buildTabs(){
  const bar = $('#tabbar'); bar.innerHTML = '';
  CATEGORIES.forEach(function(c){
    const b = document.createElement('button');
    b.className = 'tab';
    if(c.id === 'presets') b.classList.add('active','preset-tab');
    if(c.id === 'design') b.classList.add('design-tab');
    if(c.id === 'api') b.classList.add('api-tab');
    b.type = 'button';
    b.dataset.cat = c.id;
    b.textContent = c.label;
    b.addEventListener('click', function(){
      $$('#tabbar .tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderPalette(c.id);
    });
    bar.appendChild(b);
  });
}
function init(){
  buildTabs();
  renderPalette('presets');
  let restored = false;
  try{
    const raw = localStorage.getItem(LS_AUTOSAVE);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.blocks && data.blocks.length){ loadProjectData(data); restored = true; }
    }
  }catch(e){}
  updatePreview();
  historyEnabled = true;
  initHistory();
  updateFullscreenBtn();
  if(restored) toast('前回の状態を復元しました');
}
init();
})();
</script>
</body>
</html>
