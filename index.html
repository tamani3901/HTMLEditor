<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブロック de HTML エディタ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    background:#eef1f5;color:#232a31;font-size:14px;
    user-select:none;-webkit-user-select:none;overflow:hidden;
  }
  input,select,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;}
  #app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  #tabbar{
    flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;background:#fff;
    border-bottom:1px solid #dfe4ea;overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  #tabbar::-webkit-scrollbar{height:5px;}
  #tabbar::-webkit-scrollbar-thumb{background:#cfd8e0;border-radius:3px;}
  .tab{
    flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid #dfe4ea;
    background:#f8fafc;font-size:12.5px;color:#3b4652;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .tab:hover{background:#eef7f5;border-color:#8fd8c8;}
  .tab.active{background:#2ec4a6;border-color:#2ec4a6;color:#fff;font-weight:700;}
  #main{flex:1 1 auto;display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:0;overflow:hidden;}
  #palette{background:#fff;border-right:1px solid #dfe4ea;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  #palette-head{
    flex:0 0 auto;padding:10px 12px;font-size:11.5px;font-weight:700;color:#5b6875;
    letter-spacing:.04em;border-bottom:1px solid #eef1f5;background:#fbfcfe;
  }
  #palette-list{
    flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;
  }
  #palette-list::-webkit-scrollbar{width:6px;}
  #palette-list::-webkit-scrollbar-thumb{background:#cfd8e0;border-radius:3px;}
  .pal-item{
    display:flex;align-items:center;gap:6px;padding:7px 9px 7px 4px;
    border:1px solid #dfe4ea;border-radius:9px;background:#fbfdff;
    font-size:12.5px;transition:.12s;flex:0 0 auto;touch-action:pan-y;
  }
  .pal-item:hover{border-color:#8fd8c8;background:#f2fbf9;}
  .drag-handle{
    flex:0 0 auto;width:22px;text-align:center;color:#c0cad3;
    font-size:14px;cursor:grab;touch-action:none;user-select:none;line-height:1;padding:2px 0;
  }
  .drag-handle:active{cursor:grabbing;color:#2ec4a6;}
  .pal-item:hover .drag-handle{color:#8fd8c8;}
  .pi-icon{font-size:15px;width:20px;text-align:center;flex:0 0 auto;}
  .pi-body{flex:1 1 auto;min-width:0;}
  .pi-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .data-del{
    flex:0 0 auto;border:none;background:#f0f3f6;color:#8b97a3;border-radius:6px;
    width:22px;height:22px;line-height:1;font-size:12px;cursor:pointer;
  }
  .data-del:hover{background:#ffe9e6;color:#d0442c;}
  .data-item.missing{opacity:.55;}
  .data-add{display:flex;gap:6px;margin-bottom:4px;flex:0 0 auto;}
  .data-add .act{flex:1 1 auto;font-size:11.5px;padding:7px 4px;}
  .data-empty{font-size:11.5px;color:#a8b3bd;padding:10px 4px;line-height:1.6;}
  .badge-miss{font-size:10px;color:#d0442c;background:#ffeae6;border-radius:4px;padding:1px 4px;margin-left:4px;}
  #workspace{
    min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px;background:#eef1f5;display:flex;flex-direction:column;
  }
  #root-slot{
    flex:1 1 auto;min-height:100%;padding:14px;
    background:#fff;border-radius:12px;border:2px solid #e3e9ef;
  }
  .ws-block{
    background:#f8fbfd;border:1px solid #dbe2ea;border-left:3px solid #2ec4a6;
    border-radius:10px;padding:8px;box-shadow:0 1px 2px rgba(20,30,40,.04);
    transition:box-shadow .12s, outline .12s;
  }
  .ws-block.drag-over{outline:2px solid #2ec4a6;outline-offset:1px;}
  .ws-block.mini{
    display:flex;align-items:center;gap:6px;padding:5px 7px;
    border-left-color:#9aa7b3;background:#f4f7fa;border-radius:8px;
  }
  .mini-head{display:flex;align-items:center;gap:5px;flex:0 0 auto;font-size:11.5px;color:#4a5663;}
  .mini-icon{font-size:13px;}
  .mini-name{font-weight:600;}
  .mini-fields{flex:1 1 auto;display:flex;gap:5px;align-items:center;min-width:0;flex-wrap:wrap;}
  .mini-fields .fld-row{flex:1 1 auto;min-width:0;}
  .mini-fields .fld-label{display:none;}
  .mini-del{
    flex:0 0 auto;border:none;background:transparent;color:#b6c0c9;
    font-size:13px;cursor:pointer;padding:2px 5px;border-radius:5px;
  }
  .mini-del:hover{background:#ffe9e6;color:#d0442c;}
  .blk-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .blk-icon{font-size:14px;}
  .blk-name{font-size:12.5px;font-weight:700;color:#33404d;}
  .blk-tag{
    font-size:10.5px;color:#7e8b98;background:#eaeff4;border-radius:4px;
    padding:1px 5px;font-family:ui-monospace,Menlo,monospace;
  }
  .sp{flex:1 1 auto;}
  .blk-btn{
    border:none;background:#eef2f6;color:#7a8794;border-radius:6px;
    width:24px;height:24px;font-size:12px;cursor:pointer;line-height:1;
  }
  .blk-btn:hover{background:#e0f5f0;color:#1d9e83;}
  .blk-btn[data-act="del"]:hover{background:#ffe9e6;color:#d0442c;}
  .blk-fields{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
  .fld-row{display:flex;align-items:center;gap:6px;}
  .fld-label{flex:0 0 auto;font-size:11px;color:#7e8b98;min-width:64px;}
  .fld{
    flex:1 1 auto;min-width:0;width:100%;padding:5px 7px;font-size:12px;
    border:1px solid #dbe2ea;border-radius:6px;background:#fff;color:#232a31;
  }
  .fld:focus{outline:none;border-color:#2ec4a6;box-shadow:0 0 0 2px rgba(46,196,166,.15);}
  input[type="color"].fld{padding:1px;height:26px;cursor:pointer;}
  textarea.fld{resize:vertical;min-height:34px;}
  .blk-slots{display:flex;flex-direction:column;gap:4px;}
  .slot-row{display:flex;gap:5px;align-items:flex-start;}
  .slot-tag{
    flex:0 0 auto;font-size:9.5px;font-weight:700;color:#8b97a3;background:#eaeff4;
    border-radius:4px;padding:3px 5px;margin-top:2px;letter-spacing:.02em;
  }
  .slot{
    flex:1 1 auto;min-width:0;min-height:30px;padding:5px;
    border:1.5px dashed #cdd7e0;border-radius:8px;background:#fdfefe;
    display:flex;flex-direction:column;gap:5px;
  }
  .slot:empty::after{content:attr(data-empty);font-size:11px;color:#aab5bf;}
  .slot.drag-over{border-color:#2ec4a6;background:#eafaf6;}
  #drop-indicator{height:4px;border-radius:2px;background:#2ec4a6;flex:0 0 auto;margin:1px 0;}
  .drag-clone{
    position:fixed;z-index:9999;pointer-events:none;display:flex;align-items:center;gap:6px;
    padding:7px 12px;background:#2ec4a6;color:#fff;font-size:12.5px;font-weight:600;
    border-radius:9px;box-shadow:0 6px 18px rgba(20,30,40,.28);
    transform:translate(-50%,-50%);opacity:.94;
  }
  body.dragging{cursor:grabbing;}
  #right{background:#fff;border-left:1px solid #dfe4ea;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .panel-head{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    gap:6px;padding:8px 10px;border-bottom:1px solid #eef1f5;
  }
  .seg{display:flex;background:#eef2f6;border-radius:8px;padding:2px;}
  .seg button{
    border:none;background:transparent;font-size:11.5px;padding:5px 9px;
    border-radius:6px;cursor:pointer;color:#5b6875;
  }
  .seg button.active{background:#fff;color:#1d9e83;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  #preview-area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px;gap:8px;}
  #preview-frame-wrap{
    flex:1 1 auto;min-height:0;display:flex;justify-content:center;
    background:#e9edf2;border-radius:9px;padding:6px;overflow:auto;
  }
  #preview-body{width:100%;height:100%;border:0;background:#fff;border-radius:6px;}
  #preview-body.mobile{width:375px;flex:0 0 auto;border:1px solid #c9d2dc;box-shadow:0 6px 18px rgba(20,30,40,.14);}
  #preview-code{
    flex:1 1 auto;min-height:0;margin:0;overflow:auto;background:#1f2733;color:#c9e8df;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;
    padding:10px;border-radius:9px;white-space:pre;user-select:text;-webkit-user-select:text;
  }
  .hidden{display:none !important;}
  #action-area{
    flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;
    padding:10px;border-top:1px solid #eef1f5;max-height:42%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .act{
    padding:9px 6px;font-size:11.5px;border-radius:8px;border:1px solid #dfe4ea;
    background:#f8fafc;color:#3b4652;cursor:pointer;transition:.12s;
  }
  .act:hover{background:#eef7f5;border-color:#8fd8c8;}
  .act.primary{background:#2ec4a6;border-color:#2ec4a6;color:#fff;font-weight:700;}
  .act.primary:hover{background:#26b096;}
  .act.danger{color:#c0392b;border-color:#f0d5d1;}
  .act.danger:hover{background:#ffecea;}
  #modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:500;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  #modal{
    background:#fff;border-radius:14px;padding:18px;width:min(480px,100%);
    max-height:82dvh;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  #modal h3{margin:0 0 12px;font-size:15px;}
  .modal-field{display:block;margin-bottom:12px;}
  .modal-field span{display:block;font-size:11.5px;color:#7e8b98;margin-bottom:4px;}
  .modal-field input,.modal-field select{
    width:100%;padding:9px 10px;border:1px solid #dbe2ea;border-radius:8px;font-size:13px;
    background:#fff;font-family:inherit;
  }
  .slot-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .slot-item{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    border:1px solid #e3e9ef;border-radius:9px;background:#fbfcfe;
  }
  .slot-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .slot-info b{font-size:12px;}
  .slot-info span{font-size:11px;color:#8b97a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .slot-item .act{flex:0 0 auto;padding:6px 10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:6px;}
  .modal-msg{font-size:13px;line-height:1.75;color:#3b4652;white-space:pre-wrap;margin:0 0 16px;}
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
    background:#232a31;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:.22s;z-index:900;max-width:82vw;text-align:center;
  }
  #toast.show{opacity:.95;transform:translateX(-50%) translateY(0);}
  @media (max-width:1100px){
    #main{grid-template-columns:180px minmax(0,1fr) 290px;}
    .fld-label{min-width:52px;}
  }
  @media (max-width:840px){
    #main{grid-template-columns:150px minmax(0,1fr) 240px;}
    .tab{padding:6px 10px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <header id="tabbar"></header>
  <div id="main">
    <aside id="palette">
      <div id="palette-head">メディア</div>
      <div id="palette-list"></div>
    </aside>
    <section id="workspace">
      <div id="root-slot" class="slot" data-slot="container" data-empty="ここにブロックをドロップ"></div>
    </section>
    <aside id="right">
      <div class="panel-head">
        <div class="seg" id="view-seg">
          <button data-view="preview" class="active">プレビュー</button>
          <button data-view="code">コード</button>
        </div>
        <div class="seg" id="vp-seg">
          <button data-vp="desktop" class="active" title="PC表示">🖥</button>
          <button data-vp="mobile" title="モバイル表示">📱</button>
        </div>
      </div>
      <div id="preview-area">
        <div id="preview-frame-wrap"><iframe id="preview-body" title="preview"></iframe></div>
        <pre id="preview-code" class="hidden"></pre>
      </div>
      <div id="action-area">
        <button class="act primary" id="btn-export">📄 HTMLエクスポート</button>
        <button class="act" id="btn-import">📥 ファイルインポート</button>
        <button class="act" id="btn-save">💾 セーブ</button>
        <button class="act" id="btn-load">📂 セーブ読み込み</button>
        <button class="act" id="btn-json">⬇ JSON書き出し</button>
        <button class="act" id="btn-settings">⚙ 設定</button>
        <button class="act danger" id="btn-save-reset">🗑 セーブリセット</button>
        <button class="act danger" id="btn-reset">♻ プロジェクトリセット</button>
      </div>
    </aside>
  </div>
</div>
<input type="file" id="file-input" accept="*/*" multiple class="hidden">
<div id="modal-overlay" class="hidden"><div id="modal"></div></div>
<div id="toast"></div>
<div id="drop-indicator" class="hidden"></div>

<script>
(function(){
'use strict';
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r||document).querySelectorAll(s));
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================
   カテゴリ
   ========================================================= */
const CATEGORIES = [
  {id:'media',       label:'🖼 メディア',        name:'メディア・画像'},
  {id:'text',        label:'📝 テキスト',        name:'テキスト・見出し'},
  {id:'interactive', label:'🔗 リンク・ボタン',  name:'リンク・ボタン'},
  {id:'containers',  label:'📦 枠・レイアウト',  name:'枠・レイアウト'},
  {id:'lists',       label:'📋 リスト',          name:'リスト・箇条書き'},
  {id:'tables',      label:'📊 表',              name:'表（テーブル）'},
  {id:'forms',       label:'🧾 フォーム',        name:'フォーム・入力'},
  {id:'css',         label:'🎨 CSS',             name:'CSS・フォント・サイズ'},
  {id:'variables',   label:'🔢 変数・イベント',  name:'変数・イベント（動作）'},
  {id:'data',        label:'📁 データ',          name:'インポートデータ'}
];

const FONT_OPTIONS = [
  {v:'', l:'（指定なし）'},
  {v:"system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif", l:'システム標準'},
  {v:"sans-serif", l:'ゴシック (sans-serif)'},
  {v:"serif", l:'明朝 (serif)'},
  {v:"monospace", l:'等幅 (monospace)'},
  {v:"'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif", l:'ヒラギノ角ゴ / 游ゴシック'},
  {v:"'Hiragino Mincho ProN', 'Yu Mincho', 'MS PMincho', serif", l:'ヒラギノ明朝 / 游明朝'},
  {v:"'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif", l:'丸ゴシック'},
  {v:"'Noto Sans JP', 'Yu Gothic', sans-serif", l:'Noto Sans JP'},
  {v:"'Noto Serif JP', 'Yu Mincho', serif", l:'Noto Serif JP'},
  {v:"'M PLUS Rounded 1c', sans-serif", l:'M PLUS 丸ゴシック'},
  {v:"'Zen Maru Gothic', 'Yu Gothic', sans-serif", l:'Zen Maru Gothic'},
  {v:"'Kaisei Decol', serif", l:'Kaisei Decol'},
  {v:"'Yomogi', cursive", l:'Yomogi (手書き)'},
  {v:"'RocknRoll One', sans-serif", l:'RocknRoll One'},
  {v:"Georgia, 'Times New Roman', serif", l:'Georgia'},
  {v:"Arial, Helvetica, sans-serif", l:'Arial'},
  {v:"'Courier New', Courier, monospace", l:'Courier New'}
];

const TRIGGER_OPTIONS = [
  {v:'click',  l:'クリック時'},
  {v:'input',  l:'入力のたび (input)'},
  {v:'change', l:'変更時 (change)'},
  {v:'load',   l:'ページ読込時'}
];

/* =========================================================
   ブロック定義
   ========================================================= */
const BLOCKS = {

  /* ===== メディア ===== */
  'img': { cat:'media', label:'画像', icon:'🖼', tag:'img', voidTag:true, slots:['css'],
    fields:[
      {k:'src', label:'URL', type:'url', ph:'https://…'},
      {k:'alt', label:'代替テキスト', type:'text'},
      {k:'media', type:'hidden'}
    ]},
  'video': { cat:'media', label:'動画', icon:'🎬', tag:'video', slots:['css'],
    fields:[{k:'src', label:'URL', type:'url'}, {k:'media', type:'hidden'}]},
  'audio': { cat:'media', label:'音声', icon:'🔊', tag:'audio', slots:['css'],
    fields:[{k:'src', label:'URL', type:'url'}, {k:'media', type:'hidden'}]},
  'iframe': { cat:'media', label:'埋め込み', icon:'🌐', tag:'iframe', slots:['css'],
    fields:[
      {k:'src', label:'URL', type:'url'},
      {k:'w', label:'幅', type:'text', def:'560'},
      {k:'h', label:'高さ', type:'text', def:'315'}
    ]},
  'canvas': { cat:'media', label:'キャンバス', icon:'🖌', tag:'canvas', slots:['css'],
    fields:[
      {k:'w', label:'幅', type:'number', def:'300'},
      {k:'h', label:'高さ', type:'number', def:'150'}
    ]},
  'figure': { cat:'media', label:'図 (figure)', icon:'🖼', tag:'figure', container:true, slots:['container','css'], fields:[] },
  'figcaption': { cat:'media', label:'図のキャプション', icon:'📝', tag:'figcaption', textTag:true, slots:['css','var'],
    fields:[{k:'text', label:'テキスト', type:'text', def:'図の説明'}]},
  'progress': { cat:'media', label:'進捗バー', icon:'📊', tag:'progress', slots:['css'],
    fields:[
      {k:'id', label:'ID', type:'text', def:'prog1'},
      {k:'value', label:'現在値', type:'number', def:'50'},
      {k:'max', label:'最大値', type:'number', def:'100'}
    ]},
  'meter': { cat:'media', label:'メーター', icon:'🎛', tag:'meter', slots:['css'],
    fields:[
      {k:'id', label:'ID', type:'text', def:'meter1'},
      {k:'value', label:'現在値', type:'number', def:'60'},
      {k:'min', label:'最小', type:'number', def:'0'},
      {k:'max', label:'最大', type:'number', def:'100'}
    ]},
  'picture': { cat:'media', label:'レスポンシブ画像', icon:'🖼', tag:'picture', container:true, slots:['container','css'],
    fields:[{k:'srcset', label:'srcset', type:'text', ph:'image@2x.png 2x'}]},

  /* ===== テキスト ===== */
  'heading': { cat:'text', label:'見出し', icon:'H', tag:'h', slots:['css','var'],
    fields:[
      {k:'level', label:'レベル', type:'select', options:['1','2','3','4','5','6'], def:'2'},
      {k:'id', label:'ID', type:'text'},
      {k:'text', label:'テキスト', type:'text', def:'見出しテキスト'}
    ]},
  'p': { cat:'text', label:'段落', icon:'¶', tag:'p', textTag:true, slots:['css','var'],
    fields:[
      {k:'id', label:'ID', type:'text'},
      {k:'text', label:'テキスト', type:'textarea', def:'ここに文章を入力します。'}
    ]},
  'br': { cat:'text', label:'改行', icon:'↵', tag:'br', voidTag:true, slots:[], fields:[] },
  'wbr': { cat:'text', label:'改行可能点 (wbr)', icon:'⤶', tag:'wbr', voidTag:true, slots:[], fields:[] },
  'hr': { cat:'text', label:'区切り線', icon:'─', tag:'hr', voidTag:true, slots:['css'], fields:[] },
  'b': { cat:'text', label:'太字 (b)', icon:'B', tag:'b', textTag:true, slots:['css','var'],
    fields:[{k:'text', label:'テキスト', type:'text', def:'太字'}]},
  'strong': { cat:'text', label:'強調 (strong)', icon:'💪', tag:'strong', textTag:true, slots:['css','var'],
    fields:[{k:'text', label:'テキスト', type:'text', def:'強調'}]},
  'i': { cat:'text', label:'斜体 (i)', icon:'I', tag:'i', textTag:true, slots:['css','var'],
    fields:[{k:'text', label:'テキスト', type:'text', def:'斜体'}]},
  'em': { cat:'text', label:'強調 (em)', icon:'❗', tag:'em', textTag:true, slots:['css','var'],

const SLOT_LABEL = { container:'中身', css:'CSS', var:'変数', event:'イベント' };
const SLOT_EMPTY = {
  container:'ここにブロックをドロップ',
  css:'CSSブロックをドロップ',
  var:'変数ブロックをドロップ',
  event:'イベントブロックをドロップ'
};
const MAX_DEPTH = 8;

function slotKindOf(type){
  const d = BLOCKS[type]; if(!d) return null;
  if(d.cat === 'css') return 'css';
  if(d.slotKind) return d.slotKind;
  return 'block';
}
function slotOrder(def){
  const arr = [];
  if(def.container) arr.push('container');
  (def.slots||[]).forEach(s => { if(s !== 'container') arr.push(s); });
  return arr;
}
function tagLabel(def){
  if(!def.tag) return '';
  if(def.tag === 'h') return '<h1>〜<h6>';
  return '<' + def.tag + '>';
}

const LS_SLOT = i => 'html_block_editor_slot_' + i;

/* =========================================================
   フィールド生成
   ========================================================= */
function makeField(f, val){
  if(f.type === 'hidden'){
    const i = document.createElement('input');
    i.type = 'hidden'; i.className = 'fld'; i.dataset.key = f.k;
    i.value = (val != null ? val : (f.def || ''));
    return i;
  }
  const wrap = document.createElement('label');
  wrap.className = 'fld-row';
  if(f.label){
    const s = document.createElement('span');
    s.className = 'fld-label'; s.textContent = f.label;
    wrap.appendChild(s);
  }
  let inp;
  if(f.type === 'select'){
    inp = document.createElement('select');
    (f.options || []).forEach(o => {
      const op = document.createElement('option');
      if(o && typeof o === 'object'){ op.value = o.v; op.textContent = o.l; }
      else { op.value = o; op.textContent = o; }
      inp.appendChild(op);
    });
  } else if(f.type === 'textarea'){
    inp = document.createElement('textarea'); inp.rows = 2;
  } else {
    inp = document.createElement('input');
    inp.type = (f.type === 'color') ? 'color' : (f.type === 'number' ? 'number' : 'text');
    if(f.ph) inp.placeholder = f.ph;
  }
  inp.className = 'fld'; inp.dataset.key = f.k;
  let v = (val != null && val !== '') ? val : (f.def != null ? f.def : '');
  if(f.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(v)) v = '#ffffff';
  inp.value = v;
  wrap.appendChild(inp);
  return wrap;
}

/* =========================================================
   ブロック生成
   ========================================================= */
function createBlock(type, values){
  const def = BLOCKS[type];
  const el = document.createElement('div');
  el.className = 'ws-block';
  el.dataset.type = type;
  const vals = values || {};
  const isMini = (def.cat === 'css' || def.slotKind);

  if(isMini){
    el.classList.add('mini');
    const head = document.createElement('div');
    head.className = 'mini-head';
    head.innerHTML = '<span class="mini-icon">' + (def.icon || '▫') + '</span>' +
                     '<span class="mini-name">' + escapeHtml(def.label) + '</span>';
    el.appendChild(head);
    const fields = document.createElement('div');
    fields.className = 'mini-fields blk-fields';
    (def.fields || []).forEach(f => fields.appendChild(makeField(f, vals[f.k])));
    el.appendChild(fields);
    const del = document.createElement('button');
    del.className = 'mini-del'; del.dataset.act = 'del'; del.type = 'button';
    del.textContent = '✕'; del.title = '削除';
    el.appendChild(del);
    return el;
  }

  const head = document.createElement('div');
  head.className = 'blk-head';
  head.innerHTML =
    '<span class="blk-icon">' + (def.icon || '▫') + '</span>' +
    '<span class="blk-name">' + escapeHtml(def.label) + '</span>' +
    '<code class="blk-tag">' + escapeHtml(tagLabel(def)) + '</code>' +
    '<span class="sp"></span>';
  const dup = document.createElement('button');
  dup.className = 'blk-btn'; dup.dataset.act = 'dup'; dup.type = 'button';
  dup.textContent = '📋'; dup.title = '複製';
  const del = document.createElement('button');
  del.className = 'blk-btn'; del.dataset.act = 'del'; del.type = 'button';
  del.textContent = '✕'; del.title = '削除';
  head.appendChild(dup); head.appendChild(del);
  el.appendChild(head);

  if(def.fields && def.fields.length){
    const fw = document.createElement('div');
    fw.className = 'blk-fields';
    def.fields.forEach(f => fw.appendChild(makeField(f, vals[f.k])));
    el.appendChild(fw);
  }

  const slotNames = def.slots || [];
  if(slotNames.length){
    const sw = document.createElement('div');
    sw.className = 'blk-slots';
    slotOrder(def).forEach(sn => {
      if(slotNames.indexOf(sn) < 0) return;
      const row = document.createElement('div');
      row.className = 'slot-row';
      const tag = document.createElement('span');
      tag.className = 'slot-tag'; tag.textContent = SLOT_LABEL[sn];
      const slot = document.createElement('div');
      slot.className = 'slot ' + sn + '-slot';
      slot.dataset.slot = sn; slot.dataset.empty = SLOT_EMPTY[sn];
      row.appendChild(tag); row.appendChild(slot);
      sw.appendChild(row);
    });
    el.appendChild(sw);
  }
  return el;
}

/* =========================================================
   値の取得/設定
   ========================================================= */
function getValues(el){
  const out = {};
  el.querySelectorAll(':scope > .blk-fields > .fld, :scope > .blk-fields > .fld-row > .fld')
    .forEach(i => { out[i.dataset.key] = i.value; });
  return out;
}
function setField(el, key, val){
  const i = el.querySelector(':scope > .blk-fields > .fld[data-key="' + key + '"], ' +
                             ':scope > .blk-fields > .fld-row > .fld[data-key="' + key + '"]');
  if(i) i.value = val;
}
function getSlot(el, name){
  return el.querySelector(':scope > .blk-slots > .slot-row > .slot[data-slot="' + name + '"]');
}
function childBlocks(slot){
  return Array.prototype.slice.call(slot.children)
    .filter(c => c.classList && c.classList.contains('ws-block'));
}

/* =========================================================
   シリアライズ
   ========================================================= */
function serializeBlock(el){
  const values = getValues(el);
  const slots = {};
  ['container','css','var','event'].forEach(sn => {
    const slot = getSlot(el, sn);
    if(!slot) return;
    const kids = childBlocks(slot).map(serializeBlock);
    if(kids.length) slots[sn] = kids;
  });
  return { type: el.dataset.type, values: values, slots: slots };
}
function deserializeBlock(data){
  if(!data || !BLOCKS[data.type]) return null;
  const el = createBlock(data.type, data.values || {});
  const slots = data.slots || {};
  Object.keys(slots).forEach(sn => {
    const slot = getSlot(el, sn);
    if(!slot) return;
    slots[sn].forEach(cd => { const c = deserializeBlock(cd); if(c) slot.appendChild(c); });
  });
  return el;
}
function projectData(){
  return {
    version: 2,
    name: currentProjectName,
    settings: {
      baseFont: PROJECT_SETTINGS.baseFont || '',
      baseFontSize: PROJECT_SETTINGS.baseFontSize || ''
    },
    savedAt: new Date().toISOString(),
    blocks: childBlocks($('#root-slot')).map(serializeBlock),
    media: MEDIA.map(m => ({name:m.name, type:m.type, kind:m.kind}))
  };
}
function loadProjectData(data){
  if(!data) return;
  currentProjectName = data.name || '';
  PROJECT_SETTINGS = {
    baseFont: (data.settings && data.settings.baseFont) || '',
    baseFontSize: (data.settings && data.settings.baseFontSize) || ''
  };
  MEDIA.length = 0;
  (data.media || []).forEach(m => {
    MEDIA.push({ id: 'm' + Math.random().toString(36).slice(2,9),
      name: m.name, type: m.type, kind: m.kind, url: '', blob: null });
  });
  const root = $('#root-slot');
  root.innerHTML = '';
  (data.blocks || []).forEach(b => {
    const el = deserializeBlock(b);
    if(el) root.appendChild(el);
  });
  resolveMediaBlocks();
  renderPalette(currentCat);
  afterChange();
}
function resolveMediaBlocks(){
  $$('.ws-block').forEach(el => {
    const t = el.dataset.type;
    if(t !== 'img' && t !== 'video' && t !== 'audio') return;
    const v = getValues(el);
    if(!v.media) return;
    const m = MEDIA.filter(x => x.name === v.media && x.url)[0];
    if(m) setField(el, 'src', m.url);
  });
}

/* =========================================================
   HTML 生成
   ========================================================= */
function cssStyleOf(el){
  const slot = getSlot(el, 'css'); if(!slot) return '';
  const parts = [];
  childBlocks(slot).forEach(c => {
    const d = BLOCKS[c.dataset.type];
    if(!d || !d.cssProp) return;
    const v = getValues(c).value;
    if(v === '' || v == null) return;
    parts.push(d.cssProp + ': ' + v + ';');
  });
  return parts.join(' ');
}
function contentOf(el, v){
  const slot = getSlot(el, 'var');
  if(slot){
    const vb = childBlocks(slot)[0];
    if(vb){
      const vv = getValues(vb);
      if(vb.dataset.type === 'var-static') return escapeHtml(vv.value || '');
      if(vb.dataset.type === 'var-input') return '<span data-bind-input="' + escapeHtml(vv.targetId || '') + '"></span>';
    }
  }
  return escapeHtml(v.text || '');
}

/* =========================================================
   イベント生成
   ========================================================= */
function defaultTrigger(t){
  switch(t){
    case 'evt-live-value': return 'input';
    case 'evt-show-checked': return 'change';
    case 'evt-show-input': return 'click';
    case 'evt-show-text': return 'click';
    case 'evt-show-date': return 'click';
    case 'evt-toggle-hidden': return 'click';
    case 'evt-alert': return 'click';
    default: return 'click';
  }
}

function eventBody(t, kv, ownerId){
  const fromId = kv.fromId || ownerId || '';
  const toId = kv.toId || '';
  const fid = JSON.stringify(fromId);
  const tid = JSON.stringify(toId);

  switch(t){
    case 'evt-live-value':
    case 'evt-show-input':
      return `var s=document.getElementById(${fid}),t=document.getElementById(${tid});if(s&&t)t.textContent=s.value;`;

    case 'evt-show-checked': {
      const tt = JSON.stringify(kv.trueText || 'ON');
      const ft = JSON.stringify(kv.falseText || 'OFF');
      return `var s=document.getElementById(${fid}),t=document.getElementById(${tid});if(s&&t)t.textContent=s.checked?${tt}:${ft};`;
    }

    case 'evt-show-text':
      return `var t=document.getElementById(${tid});if(t)t.textContent=${JSON.stringify(kv.text||'')};`;

    case 'evt-show-date':
      return `var t=document.getElementById(${tid});if(t)t.textContent=new Date().toLocaleString('ja-JP');`;

    case 'evt-toggle-hidden':
      return `var t=document.getElementById(${tid});if(t)t.style.display=(t.style.display==='none')?'':'none';`;

    case 'evt-alert':
      return `alert(${JSON.stringify(kv.text||'')});`;

    case 'evt-counter': {
      const step = parseInt(kv.step, 10) || 1;
      const init = parseInt(kv.init, 10) || 0;
      const min = kv.min !== '' ? parseInt(kv.min, 10) : -999999;
      const max = kv.max !== '' ? parseInt(kv.max, 10) : 999999;
      return `var t=document.getElementById(${tid});if(t){var v=parseInt(t.dataset.count,10);if(isNaN(v))v=${init};v+=${step};if(v<${min})v=${min};if(v>${max})v=${max};t.dataset.count=v;t.textContent=v;}`;
    }

    case 'evt-copy-value':
      return `var s=document.getElementById(${fid}),t=document.getElementById(${tid});if(s&&t)t.value=s.value;`;

    case 'evt-toggle-text': {
      const ta = JSON.stringify(kv.textA || 'A');
      const tb = JSON.stringify(kv.textB || 'B');
      return `var t=document.getElementById(${tid});if(t){var a=t.dataset.toggle!=='1';t.textContent=a?${tb}:${ta};t.dataset.toggle=a?'1':'0';}`;
    }

    case 'evt-change-color':
      return `var t=document.getElementById(${tid});if(t)t.style.color=${JSON.stringify(kv.color||'#000000')};`;

    case 'evt-change-bg':
      return `var t=document.getElementById(${tid});if(t)t.style.background=${JSON.stringify(kv.color||'#ffff00')};`;

    case 'evt-change-img': {
      const sa = JSON.stringify(kv.srcA||''), sb = JSON.stringify(kv.srcB||'');
      return `var t=document.getElementById(${tid});if(t){t.src=(t.dataset.toggle==='1')?${sa}:${sb};t.dataset.toggle=(t.dataset.toggle==='1')?'0':'1';}`;
    }

    case 'evt-toggle-class':
      return `var t=document.getElementById(${tid});if(t)t.classList.toggle(${JSON.stringify(kv.className||'active')});`;

    case 'evt-scroll-to':
      return `var t=document.getElementById(${tid});if(t)t.scrollIntoView({behavior:'smooth'});`;

    case 'evt-open-url':
      return `window.open(${JSON.stringify(kv.url||'')},${JSON.stringify(kv.newTab?'_blank':'_self')});`;

    case 'evt-open-dialog':
      return `var t=document.getElementById(${tid});if(t&&t.showModal)t.showModal();`;

    case 'evt-close-dialog':
      return `var t=document.getElementById(${tid});if(t&&t.close)t.close();`;

    case 'evt-reset-form':
      return `var f=document.getElementById(${JSON.stringify(kv.formId||'')});if(f)f.reset();`;

    case 'evt-random': {
      const opts = String(kv.options||'').split('\n').map(s=>s.trim()).filter(Boolean);
      return `var opts=${JSON.stringify(opts)};var t=document.getElementById(${tid});if(t&&opts.length)t.textContent=opts[Math.floor(Math.random()*opts.length)];`;
    }

    case 'evt-sum-values': {
      const ids = String(kv.fromIds||'').split(',').map(s=>s.trim()).filter(Boolean);
      return `var ids=${JSON.stringify(ids)};var sum=0;ids.forEach(function(id){var e=document.getElementById(id);if(e)sum+=parseFloat(e.value||0)||0;});var t=document.getElementById(${tid});if(t)t.textContent=sum;`;
    }
  }
  return '';
}

function collectEvents(el, v, events, loadEvents, warnings){
  const slot = getSlot(el, 'event');
  if(!slot) return;
  const kids = childBlocks(slot);
  if(!kids.length) return;
  const owner = v.id || '';

  kids.forEach(k => {
    const kv = getValues(k);
    const t = k.dataset.type;

    // prevent-submit は特別扱い
    if(t === 'evt-prevent-submit'){
      if(!owner){ warnings.push('イベント対象に ID がありません'); return; }
      events.push(`document.getElementById(${JSON.stringify(owner)})?.addEventListener("submit",function(e){e.preventDefault();});`);
      return;
    }

    const trigger = kv.trigger || defaultTrigger(t);
    const body = eventBody(t, kv, owner);
    if(!body) return;

    if(trigger === 'load'){
      loadEvents.push(body);
      return;
    }

    if(!owner){
      warnings.push('イベントを設定した要素に ID がありません（スキップ）');
      return;
    }
    const listener = (trigger === 'input') ? 'input' : (trigger === 'change') ? 'change' : 'click';
    events.push(`document.getElementById(${JSON.stringify(owner)})?.addEventListener("${listener}",function(){${body}});`);
  });
}

/* =========================================================
   HTML 生成
   ========================================================= */
function attrStr(a){ return a.length ? ' ' + a.join(' ') : ''; }

function genNode(el, depth, events, loadEvents, warnings, mediaMap){
  const type = el.dataset.type;
  const def = BLOCKS[type]; if(!def) return '';
  const pad = '  '.repeat(depth);
  const v = getValues(el);
  const style = cssStyleOf(el);
  const attrs = [];
  const pushStyle = () => { if(style) attrs.push('style="' + escapeHtml(style) + '"'); };
  const resolveSrc = src => (mediaMap && v.media && mediaMap[v.media]) ? mediaMap[v.media] : (src || '');

  // ===== コンテナ =====
  if(def.container){
    let inner = '';
    const slot = getSlot(el, 'container');
    if(slot){
      childBlocks(slot).forEach(c => { inner += genNode(c, depth + 1, events, loadEvents, warnings, mediaMap); });
    }
    if(type === 'datalist' || type === 'optgroup' || type === 'picture'){
      // 空でも出力（内部に option など）
    } else if(!inner.trim()){
      warnings.push(def.label + ' の中身が空のため出力をスキップ');
      return '';
    }
    if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
    if(type === 'label' && v.for) attrs.push('for="' + escapeHtml(v.for) + '"');
    if(type === 'details' && v.open === 'open') attrs.push('open');
    if(type === 'optgroup' && v.label) attrs.push('label="' + escapeHtml(v.label) + '"');
    if(type === 'ol' && v.start && v.start !== '1') attrs.push('start="' + escapeHtml(v.start) + '"');
    if(type === 'picture' && v.srcset) attrs.push('data-srcset="' + escapeHtml(v.srcset) + '"');
    pushStyle();
    collectEvents(el, v, events, loadEvents, warnings);
    return pad + '<' + def.tag + attrStr(attrs) + '>\n' + inner + pad + '</' + def.tag + '>\n';
  }

  // ===== 汎用テキストタグ =====
  if(def.textTag){
    if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
    if(v.href) attrs.push('href="' + escapeHtml(v.href) + '"');
    if(v.target) attrs.push('target="' + escapeHtml(v.target) + '"');
    if(v.title) attrs.push('title="' + escapeHtml(v.title) + '"');
    if(v.datetime) attrs.push('datetime="' + escapeHtml(v.datetime) + '"');
    if(v.value != null && v.value !== '' && (type === 'data-tag' || type === 'option' || type === 'li')) {
      attrs.push('value="' + escapeHtml(v.value) + '"');
    }
    if(type === 'a' && v.target === '_blank') attrs.push('rel="noopener"');
    if(type === 'th' && v.colspan) attrs.push('colspan="' + escapeHtml(v.colspan) + '"');
    if(type === 'td' && v.colspan) attrs.push('colspan="' + escapeHtml(v.colspan) + '"');
    pushStyle();
    collectEvents(el, v, events, loadEvents, warnings);
    return pad + '<' + def.tag + attrStr(attrs) + '>' + contentOf(el, v) + '</' + def.tag + '>\n';
  }

  // ===== 個別 =====
  switch(type){
    case 'br': return pad + '<br>\n';
    case 'wbr': return pad + '<wbr>\n';

    case 'hr':
      pushStyle();
      return pad + '<hr' + attrStr(attrs) + '>\n';

    case 'img': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      const s = resolveSrc(v.src);
      if(s) attrs.push('src="' + escapeHtml(s) + '"');
      if(v.alt) attrs.push('alt="' + escapeHtml(v.alt) + '"');
      pushStyle();
      return pad + '<img' + attrStr(attrs) + '>\n';
    }
    case 'video': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      const s = resolveSrc(v.src);
      if(s) attrs.push('src="' + escapeHtml(s) + '"');
      attrs.push('controls', 'playsinline');
      pushStyle();
      return pad + '<video' + attrStr(attrs) + '></video>\n';
    }
    case 'audio': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      const s = resolveSrc(v.src);
      if(s) attrs.push('src="' + escapeHtml(s) + '"');
      attrs.push('controls');
      pushStyle();
      return pad + '<audio' + attrStr(attrs) + '></audio>\n';
    }
    case 'iframe': {
      if(v.src) attrs.push('src="' + escapeHtml(v.src) + '"');
      if(v.w) attrs.push('width="' + escapeHtml(v.w) + '"');
      if(v.h) attrs.push('height="' + escapeHtml(v.h) + '"');
      attrs.push('frameborder="0"', 'allowfullscreen');
      pushStyle();
      return pad + '<iframe' + attrStr(attrs) + '></iframe>\n';
    }
    case 'canvas': {
      if(v.w) attrs.push('width="' + escapeHtml(v.w) + '"');
      if(v.h) attrs.push('height="' + escapeHtml(v.h) + '"');
      pushStyle();
      return pad + '<canvas' + attrStr(attrs) + '></canvas>\n';
    }
    case 'progress': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value) attrs.push('value="' + escapeHtml(v.value) + '"');
      if(v.max) attrs.push('max="' + escapeHtml(v.max) + '"');
      pushStyle();
      return pad + '<progress' + attrStr(attrs) + '></progress>\n';
    }
    case 'meter': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value) attrs.push('value="' + escapeHtml(v.value) + '"');
      if(v.min) attrs.push('min="' + escapeHtml(v.min) + '"');
      if(v.max) attrs.push('max="' + escapeHtml(v.max) + '"');
      pushStyle();
      return pad + '<meter' + attrStr(attrs) + '></meter>\n';
    }
    case 'heading': {
      const lv = v.level || '2';
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<h' + lv + attrStr(attrs) + '>' + contentOf(el, v) + '</h' + lv + '>\n';
    }
    case 'button': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<button type="button"' + attrStr(attrs) + '>' + contentOf(el, v) + '</button>\n';
    }
    case 'submit': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      attrs.push('type="submit"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<button' + attrStr(attrs) + '>' + contentOf(el, v) + '</button>\n';
    }
    case 'reset': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      attrs.push('type="reset"');
      pushStyle();
      return pad + '<button' + attrStr(attrs) + '>' + contentOf(el, v) + '</button>\n';
    }

    // --- 単純な input 系 ---
    case 'input-text':
      attrs.push('type="text"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-password':
      attrs.push('type="password"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      pushStyle();
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-email':
      attrs.push('type="email"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-url':
      attrs.push('type="url"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      pushStyle();
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-tel':
      attrs.push('type="tel"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      pushStyle();
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-number':
      attrs.push('type="number"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.min !== '' && v.min != null) attrs.push('min="' + escapeHtml(v.min) + '"');
      if(v.max !== '' && v.max != null) attrs.push('max="' + escapeHtml(v.max) + '"');
      if(v.step) attrs.push('step="' + escapeHtml(v.step) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-date':
      attrs.push('type="date"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-time':
      attrs.push('type="time"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle();
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-color':
      attrs.push('type="color"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value) attrs.push('value="' + escapeHtml(v.value) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-range':
      attrs.push('type="range"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.min !== '' && v.min != null) attrs.push('min="' + escapeHtml(v.min) + '"');
      if(v.max !== '' && v.max != null) attrs.push('max="' + escapeHtml(v.max) + '"');
      if(v.value !== '' && v.value != null) attrs.push('value="' + escapeHtml(v.value) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-file':
      attrs.push('type="file"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.accept) attrs.push('accept="' + escapeHtml(v.accept) + '"');
      pushStyle();
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-search':
      attrs.push('type="search"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'input-hidden':
      attrs.push('type="hidden"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.value) attrs.push('value="' + escapeHtml(v.value) + '"');
      return pad + '<input' + attrStr(attrs) + '>\n';

    case 'textarea': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.ph) attrs.push('placeholder="' + escapeHtml(v.ph) + '"');
      if(v.rows) attrs.push('rows="' + escapeHtml(v.rows) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<textarea' + attrStr(attrs) + '></textarea>\n';
    }

    case 'checkbox': {
      attrs.push('type="checkbox"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<label><input' + attrStr(attrs) + '> ' + escapeHtml(v.label || '') + '</label>\n';
    }

    case 'radio': {
      attrs.push('type="radio"');
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      if(v.name) attrs.push('name="' + escapeHtml(v.name) + '"');
      if(v.value != null) attrs.push('value="' + escapeHtml(v.value) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      return pad + '<label><input' + attrStr(attrs) + '> ' + escapeHtml(v.label || '') + '</label>\n';
    }

    case 'select': {
      if(v.id) attrs.push('id="' + escapeHtml(v.id) + '"');
      pushStyle();
      collectEvents(el, v, events, loadEvents, warnings);
      const opts = String(v.options || '').split('\n').map(o => o.trim()).filter(Boolean);
      let inner = '';
      opts.forEach(o => { inner += '\n' + pad + '  <option>' + escapeHtml(o) + '</option>'; });
      return pad + '<select' + attrStr(attrs) + '>' + inner + '\n' + pad + '</select>\n';
    }
  }
  return '';
}

function runtimeScript(events, loadEvents){
  const lines = [
    'document.addEventListener("input", function(e){',
    '  if(e.target && e.target.id){',
    '    var nodes = document.querySelectorAll(\'[data-bind-input="\' + e.target.id + \'"]\');',
    '    for(var i = 0; i < nodes.length; i++){ nodes[i].textContent = e.target.value; }',
    '  }',
    '});',
    'function __initBlockEvents(){'
  ];
  events.forEach(e => lines.push('  ' + e));
  loadEvents.forEach(e => lines.push('  ' + e));
  lines.push('}');
  lines.push('if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", __initBlockEvents); } else { __initBlockEvents(); }');
  return lines.join('\n');
}

function bodyStyleAttr(){
  const p = [];
  if(PROJECT_SETTINGS.baseFont) p.push('font-family: ' + PROJECT_SETTINGS.baseFont + ';');
  if(PROJECT_SETTINGS.baseFontSize) p.push('font-size: ' + PROJECT_SETTINGS.baseFontSize + ';');
  return p.length ? ' style="' + escapeHtml(p.join(' ')) + '"' : '';
}

function generateHTML(opts){
  opts = opts || {};
  const events = [];
  const loadEvents = [];
  const warnings = [];
  const mediaMap = opts.mediaMap || null;

  let body = '';
  childBlocks($('#root-slot')).forEach(c => {
    body += genNode(c, 1, events, loadEvents, warnings, mediaMap);
  });

  const title = currentProjectName || 'My Page';
  const script = runtimeScript(events, loadEvents).replace(/<\//g, '<\\/');

  const html = [
    '<!DOCTYPE html>',
    '<html lang="ja">',
    '<head>',
    '<meta charset="UTF-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
    '<title>' + escapeHtml(title) + '</title>',
    '</head>',
    '<body' + bodyStyleAttr() + '>',
    body.replace(/\n$/, ''),
    '<script>',
    script,
    '<\/script>',
    '</body>',
    '</html>'
  ].join('\n');
  return { html: html, warnings: warnings };
}

   パレット
   ========================================================= */
function renderPalette(cat){
  currentCat = cat;
  const head = $('#palette-head');
  const list = $('#palette-list');
  list.innerHTML = '';

  const c = CATEGORIES.filter(x => x.id === cat)[0];
  head.textContent = c ? c.name : '';

  if(cat === 'data'){ renderDataTab(list); return; }

  Object.keys(BLOCKS).forEach(type => {
    const d = BLOCKS[type];
    if(d.cat !== cat) return;
    const item = document.createElement('div');
    item.className = 'pal-item';
    item.innerHTML =
      '<span class="drag-handle" title="ドラッグ">⠿</span>' +
      '<span class="pi-icon">' + (d.icon || '▫') + '</span>' +
      '<span class="pi-body"><span class="pi-label">' + escapeHtml(d.label) + '</span></span>';
    setupPaletteDrag(item, { kind:'block', type:type, label:d.label, icon:d.icon });
    list.appendChild(item);
  });
}

function setupPaletteDrag(item, payload){
  const handle = item.querySelector('.drag-handle');
  handle.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    beginDrag(e, payload, item);
  });
  item.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    if(e.pointerType === 'touch') return;
    e.preventDefault();
    beginDrag(e, payload, item);
  });
}

function renderDataTab(list){
  const addRow = document.createElement('div');
  addRow.className = 'data-add';
  const bFile = document.createElement('button');
  bFile.className = 'act'; bFile.type = 'button'; bFile.textContent = '＋ ファイル';
  bFile.addEventListener('click', () => $('#file-input').click());
  const bUrl = document.createElement('button');
  bUrl.className = 'act'; bUrl.type = 'button'; bUrl.textContent = '＋ URL';
  bUrl.addEventListener('click', addMediaByUrl);
  addRow.appendChild(bFile); addRow.appendChild(bUrl);
  list.appendChild(addRow);

  if(!MEDIA.length){
    const e = document.createElement('div');
    e.className = 'data-empty';
    e.textContent = 'インポートした画像・動画・音声がここに表示されます。⠿ をドラッグするとブロックに埋め込めます。';
    list.appendChild(e);
    return;
  }

  MEDIA.forEach(m => {
    const item = document.createElement('div');
    item.className = 'pal-item data-item' + (m.url ? '' : ' missing');
    const icon = m.kind === 'img' ? '🖼' : (m.kind === 'video' ? '🎬' : '🔊');
    item.innerHTML =
      '<span class="drag-handle" title="ドラッグ">⠿</span>' +
      '<span class="pi-icon">' + icon + '</span>' +
      '<span class="pi-body"><span class="pi-label">' + escapeHtml(m.name) + '</span></span>' +
      (m.url ? '' : '<span class="badge-miss">未読込</span>') +
      '<button class="data-del" type="button" title="削除">✕</button>';

    const delBtn = item.querySelector('.data-del');
    delBtn.addEventListener('pointerdown', e => e.stopPropagation());
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = MEDIA.indexOf(m);
      if(idx >= 0) MEDIA.splice(idx, 1);
      renderPalette('data');
      toast('削除しました：' + m.name);
    });

    const payload = { kind:'data', mediaId:m.id, name:m.name, icon:icon,
      blockType:m.kind, url:m.url, label:m.name };
    const handle = item.querySelector('.drag-handle');
    handle.addEventListener('pointerdown', e => {
      if(e.button && e.button !== 0) return;
      if(!m.url){ toast('未読み込みデータです。同じファイルをインポートしてください。'); return; }
      e.preventDefault(); e.stopPropagation();
      beginDrag(e, payload, item);
    });
    item.addEventListener('pointerdown', e => {
      if(e.button && e.button !== 0) return;
      if(e.target.closest('.drag-handle') || e.target.closest('.data-del')) return;
      if(e.pointerType === 'touch') return;
      if(!m.url){ toast('未読み込みデータです。'); return; }
      e.preventDefault();
      beginDrag(e, payload, item);
    });

    list.appendChild(item);
  });
}

/* =========================================================
   ドラッグ&ドロップ
   ========================================================= */
let drag = null;
const indicator = document.getElementById('drop-indicator');

function beginDrag(e, payload, srcEl){
  if(drag) return;
  drag = { payload, srcEl,
    x0:e.clientX, y0:e.clientY, id:e.pointerId, active:false,
    target:null, lastSlot:null, lastRef:null, lastBlock:null, clone:null };
}
function activateDrag(){
  drag.active = true;
  const c = document.createElement('div');
  c.className = 'drag-clone';
  c.innerHTML = '<span>' + (drag.payload.icon || '📦') + '</span><span>' + escapeHtml(drag.payload.label || '') + '</span>';
  document.body.appendChild(c);
  drag.clone = c;
  document.body.classList.add('dragging');
}
function depthOf(el){ let d = 0, p = el.parentElement;
  while(p){ if(p.classList && p.classList.contains('ws-block')) d++; p = p.parentElement; }
  return d;
}
function calcRef(slot, y){
  const kids = childBlocks(slot);
  for(let i = 0; i < kids.length; i++){
    const r = kids[i].getBoundingClientRect();
    if(y < r.top + r.height / 2) return kids[i];
  }
  return null;
}
function findTarget(x, y){
  const el = document.elementFromPoint(x, y);
  if(!el) return null;
  if(drag.payload.kind === 'data'){
    const blk = el.closest('.ws-block');
    if(blk && el.closest('.blk-head, .blk-fields')){
      const t = blk.dataset.type;
      if(t === 'img' || t === 'video' || t === 'audio') return { block: blk };
    }
  }
  const slot = el.closest('.slot');
  if(!slot) return null;
  const slotName = slot.dataset.slot;
  const need = (drag.payload.kind === 'data') ? 'block' : slotKindOf(drag.payload.type);
  let ok = false;
  if(slotName === 'container' && need === 'block') ok = true;
  else if(slotName === 'css' && need === 'css') ok = true;
  else if(slotName === 'var' && need === 'var') ok = true;
  else if(slotName === 'event' && need === 'event') ok = true;
  if(!ok) return null;
  if(slotName === 'container'){
    const owner = slot.closest('.ws-block');
    const d = owner ? depthOf(owner) + 1 : 0;
    if(d > MAX_DEPTH) return null;
  }
  return { slot, ref: calcRef(slot, y) };
}
function clearHighlight(){
  $$('.drag-over').forEach(e => e.classList.remove('drag-over'));
  if(indicator.parentNode) indicator.parentNode.removeChild(indicator);
  indicator.classList.add('hidden');
}
function highlight(t){
  if(!t){
    if(drag.lastSlot || drag.lastRef || drag.lastBlock){
      clearHighlight(); drag.lastSlot = null; drag.lastRef = null; drag.lastBlock = null;
    }
    return;
  }
  if(t.block){
    if(drag.lastBlock === t.block) return;
    clearHighlight();
    drag.lastBlock = t.block; drag.lastSlot = null; drag.lastRef = null;
    t.block.classList.add('drag-over');
    return;
  }
  if(drag.lastSlot === t.slot && drag.lastRef === t.ref) return;
  clearHighlight();
  drag.lastBlock = null; drag.lastSlot = t.slot; drag.lastRef = t.ref;
  t.slot.classList.add('drag-over');
  indicator.classList.remove('hidden');
  if(t.ref) t.slot.insertBefore(indicator, t.ref);
  else t.slot.appendChild(indicator);
}
function updateDrag(x, y){
  if(drag.clone){ drag.clone.style.left = x + 'px'; drag.clone.style.top = y + 'px'; }
  const t = findTarget(x, y);
  drag.target = t;
  highlight(t);
}
function finishDrag(){
  const t = drag.target;
  clearHighlight();
  if(drag.clone && drag.clone.parentNode) drag.clone.parentNode.removeChild(drag.clone);
  document.body.classList.remove('dragging');
  if(!t) return;
  if(t.block){
    const m = MEDIA.filter(x => x.id === drag.payload.mediaId)[0];
    if(!m) return;
    setField(t.block, 'src', m.url);
    setField(t.block, 'media', m.name);
    afterChange(); toast('メディアを適用しました'); return;
  }
  let newEl = null;
  if(drag.payload.kind === 'data'){
    const m = MEDIA.filter(x => x.id === drag.payload.mediaId)[0];
    if(!m) return;
    newEl = createBlock(m.kind);
    setField(newEl, 'src', m.url);
    setField(newEl, 'media', m.name);
  } else {
    newEl = createBlock(drag.payload.type);
  }
  if(!newEl) return;
  if(t.ref) t.slot.insertBefore(newEl, t.ref);
  else t.slot.appendChild(newEl);
  afterChange();
}
document.addEventListener('pointermove', function(e){
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.active){
    if(Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 6) return;
    activateDrag();
  }
  e.preventDefault();
  updateDrag(e.clientX, e.clientY);
}, { passive:false });
document.addEventListener('pointerup', function(e){
  if(!drag || e.pointerId !== drag.id) return;
  if(drag.active) finishDrag();
  drag = null;
});
document.addEventListener('pointercancel', function(){
  if(!drag) return;
  if(drag.active){
    clearHighlight();
    if(drag.clone && drag.clone.parentNode) drag.clone.parentNode.removeChild(drag.clone);
    document.body.classList.remove('dragging');
  }
  drag = null;
});

   ========================================================= */
function kindFromType(type, name){
  if(type && /^image\//.test(type)) return 'img';
  if(type && /^video\//.test(type)) return 'video';
  if(type && /^audio\//.test(type)) return 'audio';
  const ext = (name || '').split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','gif','webp','svg','bmp','heic'].indexOf(ext) >= 0) return 'img';
  if(['mp4','mov','webm','m4v','ogv'].indexOf(ext) >= 0) return 'video';
  return 'audio';
}
function mimeFromName(name){
  const ext = (name || '').split('.').pop().toLowerCase();
  const map = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
    webp:'image/webp', svg:'image/svg+xml', mp4:'video/mp4', mov:'video/quicktime',
    webm:'video/webm', mp3:'audio/mpeg', wav:'audio/wav', m4a:'audio/mp4', ogg:'audio/ogg' };
  return map[ext] || 'application/octet-stream';
}
function addMedia(file){
  const existing = MEDIA.filter(m => m.name === file.name && !m.url)[0];
  const url = URL.createObjectURL(file);
  const kind = kindFromType(file.type, file.name);
  if(existing){
    existing.url = url; existing.blob = file;
    existing.type = file.type || existing.type; existing.kind = kind;
  } else {
    MEDIA.push({ id:'m'+Math.random().toString(36).slice(2,9),
      name:file.name, type:file.type||mimeFromName(file.name), kind, url, blob:file });
  }
  renderPalette('data');
  resolveMediaBlocks();
  afterChange();
  toast('追加しました：' + file.name);
}
function addMediaByUrl(){
  const url = prompt('メディアのURLを入力してください');
  if(!url) return;
  const name = url.split('/').pop().split('?')[0] || 'media';
  const kind = /\.(mp4|mov|webm|m4v|ogv)$/i.test(name) ? 'video'
             : /\.(mp3|wav|m4a|ogg|aac)$/i.test(name) ? 'audio' : 'img';
  MEDIA.push({ id:'m'+Math.random().toString(36).slice(2,9),
    name, type:'', kind, url, blob:null });
  renderPalette('data');
  toast('URLを追加しました');
}

/* =========================================================
   ZIP
   ========================================================= */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(entries){
  const enc = new TextEncoder();
  const parts = []; const central = [];
  let offset = 0;
  entries.forEach(function(en){
    const nameBytes = enc.encode(en.name);
    const data = en.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true); lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true); lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    parts.push(local); parts.push(data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true); cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true); cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true); cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true); cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);
    offset += local.length + data.length;
  });
  let cdSize = 0;
  central.forEach(function(c){ cdSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true); ev.setUint16(8, central.length, true);
  ev.setUint16(10, central.length, true); ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  return new Blob(parts.concat(central, [eocd]), { type:'application/zip' });
}
async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined') throw new Error('この環境では解凍できません');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readZip(arrayBuffer){
  const u8 = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  let eocd = -1;
  const minPos = Math.max(0, u8.length - 22 - 65535);
  for(let i = u8.length - 22; i >= minPos; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('ZIPとして読み込めません');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = [];
  for(let i = 0; i < count; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const dataStart = lho + 30 + lnlen + lelen;
    const raw = u8.subarray(dataStart, dataStart + csize);
    let data;
    if(method === 0) data = raw.slice();
    else if(method === 8) data = await inflateRaw(raw);
    else throw new Error('未対応の圧縮');
    out.push({ name, data });
    off += 46 + nlen + elen + clen;
  }
  return out;
}

function download(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}
function collectUsedMediaNames(){
  const names = {};
  function walk(list){
    (list || []).forEach(function(b){
      if(b.values && b.values.media) names[b.values.media] = true;
      const s = b.slots || {};
      Object.keys(s).forEach(function(k){ walk(s[k]); });
    });
  }
  walk(projectData().blocks);
  return Object.keys(names);
}

   エクスポート / インポート
   ========================================================= */
async function exportHTML(){
  const res = generateHTML();
  if(!res.html) return;
  const usedNames = collectUsedMediaNames();
  const usedMedia = MEDIA.filter(m => usedNames.indexOf(m.name) >= 0 && m.blob);
  if(usedMedia.length === 0){
    download('index.html', new Blob([res.html], { type:'text/html;charset=utf-8' }));
    toast('index.html を書き出しました'); return;
  }
  const mediaMap = {};
  usedMedia.forEach(m => { mediaMap[m.name] = 'assets/' + m.name; });
  const res2 = generateHTML({ mediaMap });
  const enc = new TextEncoder();
  const entries = [{ name:'index.html', data: enc.encode(res2.html) },
                   { name:'project.json', data: enc.encode(JSON.stringify(projectData(), null, 2)) }];
  for(const m of usedMedia){
    const ab = await m.blob.arrayBuffer();
    entries.push({ name:'assets/' + m.name, data: new Uint8Array(ab) });
  }
  download('site.zip', buildZip(entries));
  toast('site.zip を書き出しました');
}
function exportJSON(){
  const data = projectData();
  const usedNames = collectUsedMediaNames();
  const usedMedia = MEDIA.filter(m => usedNames.indexOf(m.name) >= 0 && m.blob);
  if(usedMedia.length === 0){
    download('project.json', new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }));
    toast('project.json を書き出しました'); return;
  }
  (async function(){
    const enc = new TextEncoder();
    const entries = [{ name:'project.json', data: enc.encode(JSON.stringify(data, null, 2)) }];
    for(const m of usedMedia){
      const ab = await m.blob.arrayBuffer();
      entries.push({ name:'assets/' + m.name, data: new Uint8Array(ab) });
    }
    download('project.zip', buildZip(entries));
    toast('project.zip（メディア同梱）を書き出しました');
  })();
}
async function importProjectJSON(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ toast('JSONの読み込みに失敗'); return; }
  if(!data || !data.blocks){ toast('プロジェクトデータではありません'); return; }
  loadProjectData(data); toast('プロジェクトを読み込みました');
}
async function importProjectZip(file){
  const entries = await readZip(await file.arrayBuffer());
  const pj = entries.filter(e => e.name === 'project.json')[0];
  if(!pj) throw new Error('project.json が見つかりません');
  const data = JSON.parse(new TextDecoder().decode(pj.data));
  MEDIA.length = 0;
  entries.filter(e => e.name.indexOf('assets/') === 0).forEach(e => {
    const name = e.name.slice(7);
    const blob = new Blob([e.data], { type: mimeFromName(name) });
    MEDIA.push({ id:'m'+Math.random().toString(36).slice(2,9), name,
      type: blob.type, kind: kindFromType(blob.type, name),
      url: URL.createObjectURL(blob), blob });
  });
  const restored = MEDIA.slice();
  MEDIA.length = 0;
  (data.media || []).forEach(function(m){
    const found = restored.filter(r => r.name === m.name)[0];
    if(found) MEDIA.push(found);
    else MEDIA.push({ id:'m'+Math.random().toString(36).slice(2,9),
      name:m.name, type:m.type, kind:m.kind, url:'', blob:null });
  });
  currentProjectName = data.name || '';
  PROJECT_SETTINGS = {
    baseFont: (data.settings && data.settings.baseFont) || '',
    baseFontSize: (data.settings && data.settings.baseFontSize) || ''
  };
  const root = $('#root-slot');
  root.innerHTML = '';
  (data.blocks || []).forEach(b => { const el = deserializeBlock(b); if(el) root.appendChild(el); });
  resolveMediaBlocks();
  renderPalette(currentCat);
  afterChange();
  toast('zipからプロジェクトを復元しました');
}
async function handleFiles(files){
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    const lower = f.name.toLowerCase();
    try{
      if(lower.endsWith('.json')) await importProjectJSON(await f.text());
      else if(lower.endsWith('.zip')) await importProjectZip(f);
      else if(/^(image|video|audio)\//.test(f.type) || /\.(png|jpe?g|gif|webp|svg|mp4|mov|webm|mp3|wav|m4a|ogg|heic)$/i.test(f.name)) addMedia(f);
      else toast('未対応のファイル形式：' + f.name);
    }catch(err){ console.error(err); toast('読み込みエラー：' + err.message); }
  }
}

});
$('#btn-reset').addEventListener('click', function(){
  showConfirm('警告：作成中のプロジェクトを白紙に戻します。\n（この操作は取り消せません）', function(){
    $('#root-slot').innerHTML = '';
    currentProjectName = '';
    PROJECT_SETTINGS = { baseFont:'', baseFontSize:'' };
    afterChange();
    toast('プロジェクトをリセットしました');
  });
});
$('#view-seg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  $$('#view-seg button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const isPreview = b.dataset.view === 'preview';
  $('#preview-frame-wrap').classList.toggle('hidden', !isPreview);
  $('#preview-code').classList.toggle('hidden', isPreview);
  if(isPreview) updatePreview();
});
$('#vp-seg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  $$('#vp-seg button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $('#preview-body').classList.toggle('mobile', b.dataset.vp === 'mobile');
});

/* =========================================================
   タブ & 初期化
   ========================================================= */
function buildTabs(){
  const bar = $('#tabbar'); bar.innerHTML = '';
  CATEGORIES.forEach(function(c, idx){
    const b = document.createElement('button');
    b.className = 'tab' + (idx === 0 ? ' active' : '');
    b.type = 'button';
    b.dataset.cat = c.id;
    b.textContent = c.label;
    b.addEventListener('click', function(){
      $$('#tabbar .tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderPalette(c.id);
    });
    bar.appendChild(b);
  });
}
function init(){
  buildTabs();
  renderPalette('media');
  let restored = false;
  try{
    const raw = localStorage.getItem(LS_AUTOSAVE);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.blocks && data.blocks.length){ loadProjectData(data); restored = true; }
    }
  }catch(e){}
  updatePreview();
  if(restored) toast('前回の状態を復元しました');
}
init();
})();
</script>
</body>
</html>
